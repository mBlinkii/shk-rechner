<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHK Rechner</title>
<meta name="theme-color" id="app-theme-color" content="#edf2f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SHK Rechner">
<style>
  /* ---------- Reset ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  input::placeholder { color: var(--muted); opacity:.75; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.35; }
  button { font-family: inherit; }
  ::selection { background: var(--accentSoft); }

  /* ---------- Theme-Variablen (Hell als Standard) ---------- */
  :root {
    --bg:#f4f3f0; --bgT:rgba(244,243,240,.72); --surface:#ffffff; --text:#15141a; --muted:#6b6875;
    --border:#e5e1db; --field:#ffffff; --fieldBorder:#d8d4cd;
    --chip:#eae7e1; --chipActive:#ffffff; --result:#f2f0ec;
    --accent:oklch(0.55 0.16 258); --accent2:oklch(0.5 0.19 296);
    --accentSoft:oklch(0.55 0.16 258 / .12); --accentBorder:oklch(0.75 0.09 258);
    --ring:0 0 0 3px oklch(0.55 0.16 258 / .22);
    --shadow-sm:0 1px 2px rgba(25,20,40,.05), 0 1px 5px rgba(25,20,40,.04);
    --shadow:0 14px 38px rgba(25,20,40,.11), 0 3px 10px rgba(25,20,40,.05);
    --shadow-lg:0 26px 60px rgba(25,20,40,.16), 0 6px 16px rgba(25,20,40,.07);
    --shadow-accent:0 14px 34px oklch(0.55 0.16 258 / .32);
    /* Kategoriefarben */
    --c-heizung:oklch(0.62 0.18 38); --c-wp:oklch(0.58 0.17 300); --c-solar:oklch(0.72 0.16 78);
    --c-sanitaer:oklch(0.58 0.15 236); --c-allg:oklch(0.6 0.11 178); --c-fav:oklch(0.68 0.16 68);
    --tintA:.09; --tintB:.03;   /* Deckkraft der Farbfläche auf Karten */
    --glass:rgba(255,255,255,.62);
  }
  /* Dunkel via [data-theme="dark"] */
  [data-theme="dark"] {
    --bg:#0f0f13; --bgT:rgba(15,15,19,.7); --surface:#191920; --text:#f0eff4; --muted:#9e9caa;
    --border:#2a2a34; --field:#1f1f28; --fieldBorder:#343440;
    --chip:#222229; --chipActive:#393945; --result:#1f1f28;
    --accent:oklch(0.7 0.15 258); --accent2:oklch(0.63 0.18 296);
    --accentSoft:oklch(0.7 0.15 258 / .18); --accentBorder:oklch(0.5 0.1 258);
    --ring:0 0 0 3px oklch(0.7 0.15 258 / .3);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 14px 38px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.35);
    --shadow-lg:0 26px 60px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.4);
    --shadow-accent:0 14px 34px oklch(0.7 0.15 258 / .26);
    --c-heizung:oklch(0.7 0.17 38); --c-wp:oklch(0.68 0.16 300); --c-solar:oklch(0.79 0.15 78);
    --c-sanitaer:oklch(0.68 0.14 236); --c-allg:oklch(0.7 0.1 178); --c-fav:oklch(0.78 0.15 68);
    --tintA:.16; --tintB:.05;
    --glass:rgba(255,255,255,.05);
  }

  body {
    min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
    transition:background .25s,color .25s;
  }
  /* Weiche Farbschleier im Hintergrund — rein dekorativ, kostet nichts */
  body::before {
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(58vw 42vw at 8% -8%,  oklch(0.55 0.16 258 / .16), transparent 62%),
      radial-gradient(52vw 40vw at 96% 4%,  oklch(0.62 0.18 38 / .13),  transparent 62%),
      radial-gradient(46vw 38vw at 52% 100%,oklch(0.5 0.19 296 / .11),  transparent 66%);
  }
  [data-theme="dark"] body::before {
    background:
      radial-gradient(58vw 42vw at 8% -8%,  oklch(0.7 0.15 258 / .17), transparent 62%),
      radial-gradient(52vw 40vw at 96% 4%,  oklch(0.7 0.17 38 / .12),  transparent 62%),
      radial-gradient(46vw 38vw at 52% 100%,oklch(0.63 0.18 296 / .13),transparent 66%);
  }
  .wrap { max-width:900px; margin:0 auto; padding:0 24px 70px 24px; }
  .tool-wrap { max-width:580px; margin:26px auto 0 auto; }

  /* Sanftes Einblenden beim Wechsel der Ansicht */
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .anim-rise { animation:rise .34s cubic-bezier(.2,.7,.3,1) both; }

  /* Sichtbarer Tastatur-Fokus */
  :where(button, summary):focus-visible { outline:none; box-shadow:var(--ring); border-radius:9px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }

  /* ---------- Header (schwebend) ---------- */
  .header {
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    position:sticky; top:0; z-index:10; padding:18px 8px 14px 8px; margin:0 -8px;
    background:var(--bgT); backdrop-filter:blur(18px) saturate(180%); -webkit-backdrop-filter:blur(18px) saturate(180%);
    border-bottom:1px solid transparent; transition:border-color .2s;
  }
  .header.scrolled { border-bottom-color:var(--border); }
  .logo { cursor:pointer; display:flex; align-items:center; gap:11px; background:none; border:none; padding:0; }
  .logo-dot {
    width:26px; height:26px; border-radius:9px; display:grid; place-items:center; flex-shrink:0;
    background:linear-gradient(140deg, var(--accent), var(--accent2));
    box-shadow:0 4px 12px oklch(0.55 0.16 258 / .38); transition:transform .2s ease;
  }
  .logo-dot svg { width:15px; height:15px; stroke:#fff; }
  .logo:hover .logo-dot { transform:rotate(-8deg) scale(1.06); }
  .logo-text { font-size:20px; font-weight:750; letter-spacing:-0.025em; color:var(--text); }
  .header-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .seg { display:flex; background:var(--chip); border-radius:999px; padding:3px; box-shadow:inset 0 1px 3px rgba(0,0,0,.06); }
  .seg-btn {
    font-size:13px; font-weight:650; padding:7px 15px; border-radius:999px;
    cursor:pointer; transition:all .2s cubic-bezier(.2,.7,.3,1); border:none; background:transparent; color:var(--muted);
  }
  .seg-btn:focus-visible { border-radius:999px; }
  .seg-btn.active { color:var(--text); background:var(--chipActive); box-shadow:0 2px 7px rgba(0,0,0,.13); }
  [data-theme="dark"] .seg-btn.active { color:#fff; }

  .icon-btn {
    border:1px solid var(--border); background:var(--glass); color:var(--muted);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-radius:999px; padding:7px 14px; font-size:13px; font-weight:650; cursor:pointer;
    transition:all .2s cubic-bezier(.2,.7,.3,1); box-shadow:var(--shadow-sm);
  }
  .icon-btn:hover { color:var(--accent); border-color:var(--accentBorder); transform:translateY(-1px); box-shadow:var(--shadow); }
  .icon-btn:focus-visible { border-radius:999px; }

  /* ---------- Home ---------- */
  .hero { margin-top:26px; }
  .hero-title {
    font-size:clamp(30px, 6.2vw, 44px); font-weight:800; letter-spacing:-0.035em; line-height:1.06; margin:0;
    background:linear-gradient(120deg, var(--text) 12%, var(--accent) 58%, var(--accent2) 96%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle { font-size:16px; color:var(--muted); margin-top:12px; max-width:44ch; }
  .search {
    display:flex; align-items:center; gap:12px; margin-top:24px;
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px 20px;
    box-shadow:var(--shadow-sm); transition:border-color .18s, box-shadow .18s, transform .18s;
  }
  .search:focus-within { border-color:var(--accent); box-shadow:var(--ring), var(--shadow); transform:translateY(-1px); }
  .search-ring { position:relative; width:13px; height:13px; border:2px solid var(--muted); border-radius:50%; flex-shrink:0; }
  .search-ring::after { content:''; position:absolute; width:2px; height:6px; background:var(--muted); border-radius:2px; transform:rotate(-45deg); right:-3px; bottom:-5px; }
  .search input { border:none; outline:none; background:transparent; font-size:15px; color:var(--text); width:100%; font-family:inherit; }

  .group { margin-top:34px; }
  .group-head {
    display:flex; align-items:center; gap:11px; margin-bottom:16px; margin-left:-10px;
    width:calc(100% + 20px); padding:8px 10px; background:none; border:none; cursor:pointer;
    text-align:left; border-radius:12px; transition:background .15s ease;
  }
  .group-head:hover { background:var(--chip); }
  .group-head:hover .group-label { color:var(--text); }
  .group-head:focus-visible { border-radius:12px; }
  .group-head.collapsed { margin-bottom:2px; }
  /* Farbiges Icon-Plättchen statt einfachem Punkt */
  .group-dot {
    width:28px; height:28px; border-radius:9px; flex-shrink:0; display:grid; place-items:center;
    background:color-mix(in oklab, var(--cat) 16%, transparent);
    border:1px solid color-mix(in oklab, var(--cat) 32%, transparent);
    transition:transform .18s ease;
  }
  .group-dot svg { width:15px; height:15px; stroke:var(--cat); }
  .group-head:hover .group-dot { transform:scale(1.08) rotate(-5deg); }
  .group-label { font-size:13px; font-weight:750; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); transition:color .15s; }
  .group-count { font-size:11px; font-weight:700; color:var(--muted); background:var(--chip); border:1px solid var(--border); border-radius:999px; padding:2px 9px; font-variant-numeric:tabular-nums; }
  .group-head:hover .group-count { background:var(--surface); }
  .group-chev { margin-left:auto; color:var(--muted); font-size:13px; line-height:1; transition:transform .18s ease; }
  .group-head.collapsed .group-chev { transform:rotate(-90deg); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  @media (max-width:600px){ .grid { grid-template-columns:1fr; } }

  /* ---------- Karten ---------- */
  .card {
    position:relative; overflow:hidden; isolation:isolate;
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:18px 54px 17px 18px; box-shadow:var(--shadow-sm);
    transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease, border-color .2s ease;
  }
  /* Farbfläche der Kategorie — beim Hover kräftiger */
  .card::before {
    content:''; position:absolute; inset:0; z-index:-1; opacity:.55; transition:opacity .22s ease;
    background:linear-gradient(150deg,
      color-mix(in oklab, var(--cat) calc(var(--tintA) * 100%), transparent) 0%,
      color-mix(in oklab, var(--cat) calc(var(--tintB) * 100%), transparent) 46%,
      transparent 78%);
  }
  /* Weicher Lichtschein oben rechts */
  .card::after {
    content:''; position:absolute; z-index:-1; top:-46px; right:-46px; width:126px; height:126px; border-radius:50%;
    background:radial-gradient(circle, color-mix(in oklab, var(--cat) 34%, transparent), transparent 68%);
    opacity:0; transition:opacity .28s ease, transform .28s ease; transform:scale(.75);
  }
  .card:hover, .card:focus-within { box-shadow:var(--shadow); transform:translateY(-3px); border-color:color-mix(in oklab, var(--cat) 42%, var(--border)); }
  .card:hover::before, .card:focus-within::before { opacity:1; }
  .card:hover::after, .card:focus-within::after { opacity:.85; transform:scale(1); }
  /* Ganzflächig klickbarer Bereich (Stern liegt darüber) */
  .card-hit {
    position:absolute; inset:0; z-index:1; border:none; background:none; cursor:pointer;
    border-radius:18px; padding:0; -webkit-tap-highlight-color:transparent;
  }
  .card-hit:focus-visible { box-shadow:var(--ring); }
  .card-body { position:relative; pointer-events:none; }
  .card-top { display:flex; align-items:center; gap:9px; }
  .card-icon {
    width:24px; height:24px; border-radius:7px; flex-shrink:0; display:grid; place-items:center;
    background:color-mix(in oklab, var(--cat) 18%, transparent);
  }
  .card-icon svg { width:13px; height:13px; stroke:var(--cat); }
  .card-name { font-size:16px; font-weight:700; letter-spacing:-0.015em; color:var(--text); }
  .card-desc { font-size:13.5px; color:var(--muted); margin-top:7px; line-height:1.5; }
  /* In der Favoriten-Gruppe zusätzlich die Herkunftskategorie zeigen */
  .card-cat { font-size:11px; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; color:var(--cat); margin-top:9px; }

  /* ---------- Favoriten-Stern ---------- */
  .fav-btn {
    position:absolute; top:10px; right:10px; z-index:2;
    width:34px; height:34px; border-radius:11px; display:grid; place-items:center;
    border:1px solid var(--border); background:var(--chip); cursor:pointer; padding:0;
    color:var(--muted); box-shadow:var(--shadow-sm);
    transition:background .18s ease, border-color .18s ease, box-shadow .18s ease,
               transform .18s cubic-bezier(.2,.7,.3,1), color .18s ease;
  }
  .fav-btn svg { width:18px; height:18px; stroke-width:1.8; }
  /* Beim Überfahren der Karte hebt sich die Schaltfläche deutlich ab */
  .card:hover .fav-btn, .card:focus-within .fav-btn {
    background:var(--surface); border-color:var(--fieldBorder); color:var(--text); box-shadow:var(--shadow-sm);
  }
  /* Direkt auf dem Stern: klar in Favoritenfarbe */
  .fav-btn:hover, .card:hover .fav-btn:hover {
    color:#fff; transform:scale(1.1);
    background:linear-gradient(140deg, var(--c-fav), color-mix(in oklab, var(--c-fav) 62%, var(--accent)));
    border-color:transparent; box-shadow:0 5px 14px color-mix(in oklab, var(--c-fav) 45%, transparent);
  }
  .fav-btn:hover svg { fill:rgba(255,255,255,.34); }
  .fav-btn:focus-visible { border-radius:11px; box-shadow:var(--ring); }
  /* Gesetzter Favorit: dauerhaft farbig, unabhängig vom Hover */
  .fav-btn.on, .card:hover .fav-btn.on, .card:focus-within .fav-btn.on {
    color:var(--c-fav);
    background:color-mix(in oklab, var(--c-fav) 15%, var(--surface));
    border-color:color-mix(in oklab, var(--c-fav) 42%, transparent);
  }
  .fav-btn.on svg { fill:var(--c-fav); }
  .fav-btn.on:hover { color:#fff; }
  .fav-btn.on:hover svg { fill:rgba(255,255,255,.4); }
  /* Touch-Geräte kennen kein Hover — dort ist die Schaltfläche immer voll sichtbar */
  @media (hover: none) {
    .fav-btn { background:var(--surface); border-color:var(--fieldBorder); color:var(--muted); }
    .fav-btn:active { transform:scale(.92); }
  }
  @keyframes pop { 0%{transform:scale(1);} 40%{transform:scale(1.34) rotate(11deg);} 100%{transform:scale(1);} }
  .fav-btn.just { animation:pop .34s cubic-bezier(.3,1.4,.5,1); }
  /* Stern in der Werkzeug-Ansicht */
  .fav-tool {
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface);
    color:var(--muted); border-radius:999px; padding:7px 14px 7px 11px; font-size:13px; font-weight:650;
    cursor:pointer; box-shadow:var(--shadow-sm); transition:all .18s ease;
  }
  .fav-tool svg { width:15px; height:15px; }
  .fav-tool:hover { color:var(--c-fav); border-color:color-mix(in oklab, var(--c-fav) 45%, var(--border)); transform:translateY(-1px); }
  .fav-tool.on { color:var(--c-fav); border-color:color-mix(in oklab, var(--c-fav) 45%, var(--border)); background:color-mix(in oklab, var(--c-fav) 11%, var(--surface)); }
  .fav-tool.on svg { fill:var(--c-fav); }
  .fav-tool:focus-visible { border-radius:999px; }
  .fav-empty {
    grid-column:1/-1; border:1.5px dashed var(--fieldBorder); border-radius:16px; padding:22px;
    text-align:center; color:var(--muted); font-size:13.5px; line-height:1.6;
  }
  .no-results { margin-top:40px; text-align:center; color:var(--muted); font-size:15px; }
  .footer-note { text-align:center; font-size:12px; color:var(--muted); margin-top:52px; opacity:.8; }
  .app-save-wrap { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; text-align:center; margin-top:14px; }
  .app-save {
    border:1px solid var(--border); background:var(--surface); color:var(--muted);
    border-radius:999px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer;
    transition:all .18s ease; box-shadow:var(--shadow-sm);
  }
  .app-save:hover { color:var(--accent); border-color:var(--accentBorder); transform:translateY(-1px); }
  .app-save:focus-visible { border-radius:999px; }
  .home-hint { max-width:560px; margin:16px auto 0 auto; }
  .hint-step { margin-top:12px; }
  .hint-step:first-child { margin-top:2px; }
  .hint-step strong { display:block; font-size:13px; color:var(--text); margin-bottom:3px; }

  /* ---------- Tool ---------- */
  .back { display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:14px; font-weight:500; color:var(--muted); background:none; border:none; padding:2px 4px; margin-left:-4px; border-radius:8px; transition:color .15s; }
  .back:hover { color:var(--text); }
  .back .chev { font-size:17px; line-height:1; transition:transform .15s ease; }
  .back:hover .chev { transform:translateX(-2px); }
  .tool-top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .tool-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-top:20px; }
  .tool-cat { display:inline-flex; align-items:center; gap:8px; padding:5px 12px 5px 8px; border-radius:999px;
    background:color-mix(in oklab, var(--cat) 13%, transparent);
    border:1px solid color-mix(in oklab, var(--cat) 28%, transparent); }
  .tool-cat-dot { width:17px; height:17px; display:grid; place-items:center; flex-shrink:0; }
  .tool-cat-dot svg { width:14px; height:14px; stroke:var(--cat); }
  .tool-cat-label { font-size:11.5px; font-weight:750; letter-spacing:0.08em; text-transform:uppercase; color:var(--cat); }
  .tool-name {
    font-size:clamp(27px, 5.6vw, 34px); font-weight:800; letter-spacing:-0.032em; margin-top:14px; line-height:1.1;
    background:linear-gradient(115deg, var(--text) 22%, var(--cat) 128%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tool-desc { font-size:15px; color:var(--muted); margin-top:9px; line-height:1.55; }
  .tool-explain { margin-top:18px; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:var(--shadow-sm); }
  .tool-explain summary { cursor:pointer; padding:13px 16px; font-size:13.5px; font-weight:650; color:var(--text); list-style:none; user-select:none; border-radius:14px; }
  .tool-explain summary::-webkit-details-marker { display:none; }
  .tool-explain summary::before { content:'▸'; display:inline-block; margin-right:9px; color:var(--accent); transition:transform .18s ease; }
  .tool-explain[open] summary::before { transform:rotate(90deg); }
  .tool-explain-body { padding:0 16px 15px 16px; font-size:13.5px; color:var(--muted); line-height:1.65; }

  .fields { display:flex; flex-direction:column; gap:18px; margin-top:28px; }
  .field { display:flex; flex-direction:column; gap:8px; }
  .field-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .field-label { font-size:14px; font-weight:600; color:var(--text); }
  .field-unit { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .field input, .field select {
    width:100%; padding:12px 15px; font-size:16px; border:1px solid var(--fieldBorder);
    border-radius:11px; background:var(--field); color:var(--text); outline:none; font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field select { cursor:pointer; }
  .field input:hover, .field select:hover { border-color:var(--accentBorder); }
  .field input:focus, .field select:focus { border-color:var(--accent); box-shadow:var(--ring); }
  .field.invalid input, .field.invalid select { border-color:#c63d4f; box-shadow:0 0 0 3px rgba(198,61,79,.13); }
  .field-error { color:#b52d42; font-size:12.5px; line-height:1.45; }
  [data-theme="dark"] .field-error { color:#ff8798; }

  /* dynamische Abschnitte (Rohrvolumen, Heizlast) */
  .rohr-section { border:1px solid var(--border); border-radius:13px; background:var(--surface); padding:14px 16px; box-shadow:var(--shadow-sm); }
  .rohr-section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .rohr-section-title { font-size:12px; font-weight:700; letter-spacing:0.06em; color:var(--muted); text-transform:uppercase; }
  .rohr-remove { border:none; background:transparent; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 6px; border-radius:7px; transition:color .15s, background .15s; }
  .rohr-remove:hover { color:var(--accent); background:var(--accentSoft); }

          // Beim 077B/077Z-Code ist nur eine Jahresziffer enthalten. Das
          // Jahrzehnt bleibt deshalb auch bei automatischer Erkennung auswählbar.
          daFields.push(decadeFld);
          return daFields;
        }
        if (ev.hersteller==='honeywell') return [makerFld,
          {key:'format',type:'select',label:'Datumscode-Format',options:[['auto','automatisch erkennen'],['yyww','vierstellig seit 10/1975 · YYWW'],['alt','Buchstabencode vor 10/1975']]},
          {key:'code',type:'text',label:'Datumscode',placeholder:'z. B. 7812, 0042 oder AZ',maxlength:20,inputmode:'text'}
        ];
        if (ev.hersteller==='grundfos') return [makerFld,
          {key:'code',type:'text',label:'PC-/Produktionscode',placeholder:'z. B. PC 0213 oder P3-2132',maxlength:30,inputmode:'text'}
        ];
        return [makerFld,
          {key:'code',type:'text',label:'MFY-Herstellungsdatum',placeholder:'z. B. 2020W53',maxlength:24,inputmode:'text'}
        ];
      }
      default: return [];
    }
  }

  // ---------- Berechnungen ----------
  function computeFor(id, ev) {
    switch (id) {
      case 'mag': {
        if (ev.art === 'solar') {
          var vaS=P(ev.vol), flaecheS=P(ev.flaeche), hstatS=P(ev.hstat), psvS=P(ev.psv), pminS=P(ev.pmin);
          var kollS = KOLL[ev.kolltyp] || KOLL.flach;
          var vkS = flaecheS*kollS.lpm2;
          var rohrdampfS=P(ev.rohrdampf), betaS=P(ev.beta)/100;
          var VeS=vaS*betaS, VvS=Math.max(vaS*0.04,3), VdS=vkS+rohrdampfS;
          var p0hS=Math.max(hstatS/10+0.5,1.0);
          var paS=Math.max(p0hS+0.3,pminS), p0S=paS-0.3;
          var pminSAktiv=pminS>p0hS+0.3+1e-9;
          var peS=psvS<=5?psvS*0.9:psvS-0.5;
          var validS=peS>p0S, engS=validS&&(peS-p0S)<1.5;
          var VnS=validS?(VeS+VvS+VdS)*(peS+1)/(peS-p0S):NaN;
          var sizesS=[12,18,25,35,50,80,100,140,200,250,300,400,500];
          var sizeS=isFinite(VnS)?sizesS.find(function(s){return s>=VnS;}):null;
          return { main:{label:'Empfohlenes Solar-MAG',value:sizeS?String(sizeS):(isFinite(VnS)?'> '+sizesS[sizesS.length-1]:'–'),unit:'l'},
            subs:[
              {label:'Berechnetes Nennvolumen',value:fmt(VnS,1)+' l'},
              {label:'Kollektorinhalt ('+fmt(flaecheS,1)+' m² × '+fmt(kollS.lpm2,1)+' l/m²)',value:fmt(vkS,1)+' l'},
              {label:'Ausdehnungsvolumen Ve',value:fmt(VeS,1)+' l'},
              {label:'Verdampfungsvolumen (Kollektor + Rohr)',value:fmt(VdS,1)+' l'},
              {label:'davon Rohrinhalt im Dampfbereich',value:fmt(rohrdampfS,1)+' l'},
              {label:'Flüssigkeitsvorlage Vfv (4 %, min. 3 l)',value:fmt(VvS,1)+' l'},
              {label:'Ausdehnung Solarmedium β',value:fmt(betaS*100,1)+' %'},
              {label:'Vordruck p₀',value:fmt(p0S,2)+' bar'},
              {label:'Fülldruck p_a (kalt)'+(pminSAktiv?' — durch Mindestdruck bestimmt':''),value:fmt(paS,2)+' bar'},
              {label:'Mindest-Systemdruck (Vorgabe)',value:fmt(pminS,2)+' bar'},
              {label:'Enddruck pₑ',value:fmt(peS,2)+' bar'}
            ],
            note:(!validS?'Eingaben prüfen: Enddruck pₑ muss über dem Vordruck p₀ liegen. ':'')
              +(engS?'Druckdifferenz pₑ − p₀ liegt unter 1,5 bar — höheren Ansprechdruck prüfen. ':'')
              +'Auslegung nach Herstellerverfahren: V_MAG = (Vd + Ve + Vfv) × Druckfaktor. Flüssigkeitsvorlage 4 % des Anlagenvolumens, mindestens 3 l. Im Stagnationsfall müssen der vollständig entleerte Kollektor und alle dampfgefüllten Rohrabschnitte aufgenommen werden. β, Kollektor- und Rohrinhalt aus den Produkt-/Anlagendaten übernehmen; die Flächenwerte sind nur eine Vorbelegung.' };
        }
        if (ev.art === 'trinkwasser') {
          var vspW=P(ev.vol), tkW=P(ev.tk), twW=P(ev.tw), pminW=P(ev.pmin), pInW=P(ev.peingang), psvW=P(ev.psv);
          var rcW=interp(densTable,tkW), rhW=interp(densTable,twW);
          var betaW=rcW/rhW-1; if (betaW<0) betaW=0;
          var VeW=vspW*betaW;
          var p0W=Math.max(0.5,pInW), peW=psvW>5?psvW*0.9:psvW-0.5;
          var validW=peW>p0W;
          var VnW=validW?VeW*(peW+1)/(peW-p0W):NaN;
          var sizeW=isFinite(VnW)?twSizes.find(function(s){return s>=VnW;}):null;
          return { main:{label:'Empfohlenes Trinkwasser-MAG',value:sizeW?String(sizeW):(isFinite(VnW)?'> '+twSizes[twSizes.length-1]:'–'),unit:'l'},
            subs:[
              {label:'Berechnetes Nennvolumen',value:fmt(VnW,1)+' l'},
              {label:'Ausdehnungswasser Ve',value:fmt(VeW,2)+' l'},
              {label:'Ausdehnung β',value:fmt(betaW*100,2)+' %'},
              {label:'Gasvordruck p₀',value:fmt(p0W,2)+' bar'},
              {label:'Mindest-Systemdruck (Vorgabe)',value:fmt(pminW,2)+' bar'},
              {label:'max. Eingangsdruck / Druckminderer',value:fmt(pInW,2)+' bar'},
              {label:'Enddruck pₑ',value:fmt(peW,2)+' bar'}
            ],
            note:(!validW?'Eingaben prüfen: Enddruck pₑ muss über dem Vordruck p₀ liegen. ':'')
              +'Vereinfachte Auslegung nach DIN 4807-5 / DIN 1988-200 und Herstellerverfahren. p₀ entspricht dem maximalen Eingangsdruck beziehungsweise der Einstellung des Druckminderers; pₑ = Ansprechdruck minus 0,5 bar beziehungsweise bei über 5 bar minus 10 %. Durchströmtes, DVGW-geprüftes MAG-W verwenden.' };
        }
        var vol=P(ev.vol), tmax=P(ev.tmax), hstat=P(ev.hstat), psv=P(ev.psv);
        var pmin = P(ev.pmin);
        var n = interp(Etable, tmax);
        var Ve = vol*n, Vv = Math.max(vol*0.005, 3);
        // Vordruck aus statischer Höhe; der Mindest-Systemdruck hebt bei Bedarf den Fülldruck an
        var p0h = Math.max(hstat/10 + 0.2, 0.5);
        var pa = Math.max(p0h + 0.3, pmin);         // Anlagenfülldruck (kalt), mind. Mindest-Systemdruck
        var p0 = pa - 0.3;                          // MAG-Vordruck
        var pminAktiv = pmin > p0h + 0.3 + 1e-9;    // Mindestdruck ist maßgebend (nicht die statische Höhe)
        var pe = psv <= 5 ? psv*0.9 : psv-0.5;
        var valid = pe > p0;                        // Enddruck muss über dem Vordruck liegen
        var eng = valid && (pe - p0) < 1.0;          // sehr kleine Druckdifferenz → großes Gefäß
        var Vn = valid ? (Ve+Vv)*(pe+1)/(pe-p0) : NaN;
        var sizes = [8,12,18,25,35,50,80,100,140,200,250,300,400,500,600,800,1000];
        var size = isFinite(Vn) ? sizes.find(function(s){return s >= Vn;}) : null;
        return { main:{label:'Empfohlenes Ausdehnungsgefäß', value: size ? String(size) : (isFinite(Vn) ? '> '+sizes[sizes.length-1] : '–'), unit:'l'},
          subs:[
            {label:'Berechnetes Nennvolumen', value:fmt(Vn,1)+' l'},
            {label:'Ausdehnungsvolumen', value:fmt(Ve,1)+' l'},
            {label:'Wasservorlage', value:fmt(Vv,1)+' l'},
            {label:'Vordruck p₀', value:fmt(p0,2)+' bar'},
            {label:'Fülldruck p_a (kalt)'+(pminAktiv?' — durch Mindestdruck bestimmt':''), value:fmt(pa,2)+' bar'},
            {label:'Mindest-Systemdruck (Vorgabe)', value:fmt(pmin,2)+' bar'},
            {label:'Enddruck pₑ', value:fmt(pe,2)+' bar'}
          ],
          note: (!valid ? 'Eingaben prüfen: Enddruck pₑ muss über dem Vordruck p₀ liegen — Sicherheitsventil mit höherem Ansprechdruck wählen, Mindest-Systemdruck senken oder statische Höhe prüfen. ' : '')
            + (eng ? 'Druckdifferenz pₑ − p₀ liegt unter 1,0 bar — das Gefäß wird dadurch sehr groß und die Auslegung ist knapp. Höheren Ansprechdruck oder eine Druckhaltestation prüfen. ' : '')
            + (isFinite(Vn) && !size ? 'Über 1000 l Nennvolumen: mehrere Gefäße parallel schalten oder eine Druckhaltestation (Kompressor- bzw. Pumpendruckhaltung) vorsehen. ' : '')
            + 'Orientierungswerte nach DIN EN 12828. Vordruck p₀ = Fülldruck − 0,3 bar; Fülldruck p_a = statische Höhe / 10 + 0,5 bar, mindestens jedoch der eingetragene Mindest-Systemdruck (Standard 0,8 bar, kalt vor dem Aufheizen).' };
      }
      case 'leistung': {
        if (ev.modus==='leistung') return computeFor('leistungaus',ev);
        if (ev.modus==='waermetauscher') return computeFor('wtdurch',ev);
        var Pk=P(ev.leistung), dt=P(ev.dt);
        var V = dt > 0 ? Pk*860/dt : NaN;
        return { main:{label:'Volumenstrom', value:fmt(V,0), unit:'l/h'},
          subs:[
            {label:'Volumenstrom', value:fmt(V/60,2)+' l/min'},
            {label:'Volumenstrom', value:fmt(V/1000,3)+' m³/h'},
            {label:'Heizleistung', value:fmt(Pk,2)+' kW'},
            {label:'Spreizung Δt', value:fmt(dt,1)+' K'}
          ],
          note:'Formel: V = Q × 860 / Δt (Wasser, c = 1,163 Wh/kg·K).',
          refTitle:'Übliche Spreizungen Δt', refs:SPREIZUNGEN };
      }
      case 'leistungaus': {
        var Vin=P(ev.vstrom);
        var Vh = ev.veinheit === 'l/min' ? Vin*60 : ev.veinheit === 'm³/h' ? Vin*1000 : Vin;   // Eingabe → l/h
        var dt2=P(ev.dt);
        var Qk = Vh*dt2/860;            // kW
        return { main:{label:'Heizleistung', value:fmt(Qk,2), unit:'kW'},
          subs:[
            {label:'Heizleistung', value:fmt(Qk*1000,0)+' W'},
            {label:'Heizleistung', value:fmt(Qk*860,0)+' kcal/h'},
            {label:'Volumenstrom', value:fmt(Vh,0)+' l/h'},
            {label:'Volumenstrom', value:fmt(Vh/60,2)+' l/min'},
            {label:'Spreizung Δt', value:fmt(dt2,1)+' K'}
          ],
          note:'Formel: Q = V × Δt / 860 (Wasser, c = 1,163 Wh/kg·K). Umkehrung von „Volumenstrom aus Leistung".',
          refTitle:'Übliche Spreizungen Δt', refs:SPREIZUNGEN };
      }
      case 'heizkoerper': {
        if (ev.modus==='bauform') return computeFor('hkleistung',ev);
        var pn=P(ev.pnorm), vl=P(ev.vl), rl=P(ev.rl), tr=P(ev.tr), nn=P(ev.n)||1.3;
        var A=vl-tr, B=rl-tr, dtlog;
        // Plausibilität: Vorlauf > Rücklauf > Raumtemperatur — sonst ist der Fall physikalisch unmöglich
        var vertauscht = rl > vl;
        var zuKalt = B <= 0 || A <= 0;
        if (vertauscht || zuKalt) dtlog = NaN;
        else if (A !== B) dtlog = (vl-rl)/Math.log(A/B);
        else dtlog = A;
        var dtnorm=49.83;
        var f = isFinite(dtlog) ? Math.pow(dtlog/dtnorm, nn) : NaN;
        var Pa = pn*f;
        var hkWarn = vertauscht
          ? 'Eingaben prüfen: die Rücklauftemperatur ('+fmt(rl,0)+' °C) liegt über der Vorlauftemperatur ('+fmt(vl,0)+' °C) — die Werte sind vermutlich vertauscht. '
          : (zuKalt ? 'Eingaben prüfen: Vor- und Rücklauf müssen über der Raumtemperatur ('+fmt(tr,0)+' °C) liegen, sonst gibt der Heizkörper keine Wärme ab. ' : '');
        return { main:{label:'Tatsächliche Wärmeleistung', value:fmt(Pa,0), unit:'W'},
          subs:[
            {label:'Korrekturfaktor f', value:fmt(f,3)},
            {label:'Übertemperatur Δt', value:fmt(dtlog,1)+' K'},
            {label:'Norm-Δt (75/65/20)', value:'49,8 K'},
            {label:'Normleistung', value:fmt(pn,0)+' W'}
          ],
          note: hkWarn + 'Der Heizkörper-Exponent n beschreibt, wie stark die Wärmeleistung von der Übertemperatur abhängt: Q = Q_norm × (Δt/Δt_norm)ⁿ. Je größer n, desto stärker fällt die Leistung bei niedriger Vorlauftemperatur. Ermittlung aus dem Datenblatt mit zwei Leistungsangaben bei zwei Spreizungen: n = ln(Q₁/Q₂) / ln(Δt₁/Δt₂). Die Typ-Auswahl oben trägt nur einen Richtwert ein — der exakte Wert steht im Herstellerdatenblatt.',
          refTitle:'Typische Exponenten n', refs:[
            {label:'Plattenheizkörper', value:'1,30'},
            {label:'Stahlradiator',     value:'1,30'},
            {label:'Gussradiator',      value:'1,30'},
            {label:'Konvektor',         value:'1,40'},
            {label:'Fußbodenheizung',   value:'1,10'}
          ] };
      }
      case 'hkleistung': {
        var hoehe=P(ev.hoehe), laenge=P(ev.laenge);
        var Qnorm, nExp, info;
        if (ev.bauart === 'platte') {
          var q600 = PANEL_Q600[ev.ptyp] || PANEL_Q600['22'];
          // Norm-Leistung 75/65/20: spez. Leistung × Länge × Höhen-Korrektur (Bezug 600 mm)
          Qnorm = (laenge/1000) * q600 * Math.pow(hoehe/600, 0.7);
          nExp = 1.30;
          info = 'Plattenheizkörper Typ ' + ev.ptyp;
        } else {
          var tiefe=P(ev.tiefe);
          var k = RAD_K[ev.bauart] || RAD_K.stahl;
          // Norm-Leistung über Frontfläche × Bautiefe × Wärmedichte
          Qnorm = (hoehe/1000) * (laenge/1000) * tiefe * k;
          nExp = 1.30;
          info = (ev.bauart === 'guss' ? 'Gussradiator' : 'Stahlradiator');
        }
        var subs = HK_TEMPSETS.map(function(s){
          var vl=s[0], rl=s[1], tr=20;
          var A=vl-tr, B=rl-tr;
          var dl = (A>0 && B>0 && A!==B) ? (vl-rl)/Math.log(A/B) : (A>0?A:NaN);
          var fac = isFinite(dl) ? Math.pow(dl/49.83, nExp) : NaN;
          var W = Qnorm*fac;
          return { label: vl+'/'+rl+'/20 °C  (Δt '+fmt(dl,1)+' K)', value: fmt(W,0)+' W' };
        });
        return { main:{label:'Geschätzte Leistung 75/65/20', value:fmt(Qnorm,0), unit:'W'},
          subs: subs,
          note:'Richtwert-Schätzung für '+info+' (Exponent n='+fmt(nExp,2)+'). Plattenheizkörper aus spez. Leistung × Länge × (Höhe/600)^0,7; Gliederheizkörper aus Frontfläche × Bautiefe × Wärmedichte. Genaue Werte bitte dem Herstellerdatenblatt entnehmen.' };
      }
      case 'heizlast': {
        var hl = ensureHeizlast();
        var std = STANDARDS.find(function(s){ return s.id === hl.standard; }) || STANDARDS[2];
        var hf = P(hl.hoehe) > 0 ? P(hl.hoehe)/2.5 : 1;   // Korrektur auf Bezugshöhe 2,5 m
        var specEff = std.w * hf;
        var total=0, totalA=0, subs=[];
        hl.rooms.forEach(function(r, i){
          var a=P(r.flaeche); var w=a*specEff;
          total+=w; totalA+=a;
          subs.push({ label:(r.name||('Raum '+(i+1)))+' ('+fmt(a,1)+' m²)', value:fmt(w,0)+' W' });
        });
        subs.push({ label:'Gesamtfläche', value:fmt(totalA,1)+' m²' });
        subs.push({ label:'spezifische Heizlast', value:fmt(specEff,0)+' W/m²' });
        subs.push({ label:'Gesamt-Heizlast', value:fmt(total,0)+' W' });
        return { main:{label:'Gesamt-Heizlast', value:fmt(total/1000,2), unit:'kW'},
          subs:subs,
          note:'Überschlag nach spezifischer Heizlast (W/m²) je Gebäudestandard — Anhaltswerte, bezogen auf 2,5 m Raumhöhe. Die genaue Heizlast wird raumweise nach DIN EN 12831 ermittelt (Bauteile, Fenster, Lüftung, Wärmebrücken). Für die ganze Wohnung alle Räume eintragen, für einen einzelnen Raum nur diesen.' };
      }
      case 'sv': {
        var Q=P(ev.leistung), hstat=P(ev.hstat);
        var auto = ev.psv === 'auto';
        // Druckkette nach DIN EN 12828
        var pstat = hstat/10;
        var pa = Math.max(pstat + 0.5, 0.8);        // Anlagenfülldruck (kalt), mind. 0,8 bar Systemdruck
        var p0 = pa - 0.3;                          // MAG-Vordruck
        var peMin = pa + 0.5;                       // erforderlicher Enddruck mit Reserve
        var psvMin = peMin / 0.9;                   // Schließdruckdifferenz 10 %
        var stdP = [2.5,3.0];
        var psvCalc = stdP.find(function(p){ return p >= psvMin; }) || Math.ceil(psvMin*10)/10;
        var psv = auto ? psvCalc : P(ev.psv);
        var pe = psv<=5 ? psv*0.9 : psv-0.5;        // max. Betriebsdruck (Schließdruck)
        // Geprüfte maximale Heizleistungen der hinterlegten AFRISO-H-Baureihe.
        // Für 2,5 und 3 bar gelten dieselben Grenzen; keine Druckinterpolation.
        var approved = Math.abs(psv-2.5)<0.001 || Math.abs(psv-3)<0.001;
        var ratings=[50,100,200,350,600,900];
        var valves=[
          {dn:'DN 15',conn:'½" × ¾"',kw:ratings[0]}, {dn:'DN 20',conn:'¾" × 1"',kw:ratings[1]},
          {dn:'DN 25',conn:'1" × 1¼"',kw:ratings[2]}, {dn:'DN 32',conn:'1¼" × 1½"',kw:ratings[3]},
          {dn:'DN 40',conn:'1½" × 2"',kw:ratings[4]}, {dn:'DN 50',conn:'2" × 2½"',kw:ratings[5]}
        ];
        var v = approved ? valves.find(function(x){ return x.kw >= Q; }) : null;
        var maxKw = ratings[ratings.length-1];
        var subs=[
          {label:'Ansprechdruck'+(auto?' (berechnet)':''), value:fmt(psv,1)+' bar'},
          {label:'geprüfte max. Leistung dieser Größe', value:v?fmt(v.kw,0)+' kW':'separater Produktnachweis'},
          {label:'Kessel-/Wärmeleistung', value:fmt(Q,1)+' kW'},
          {label:'statischer Druck', value:fmt(pstat,2)+' bar'}
        ];
        if (auto) {
          subs.push({label:'MAG-Vordruck p₀', value:fmt(p0,2)+' bar'});
          subs.push({label:'Anlagenfülldruck p_a (min. 0,8 bar)', value:fmt(pa,2)+' bar'});
          subs.push({label:'max. Enddruck pₑ', value:fmt(pe,2)+' bar'});
          subs.push({label:'rechn. Mindestdruck', value:fmt(psvMin,2)+' bar'});
        }
        var pLow = !auto && hstat>0 && psv < pstat + 0.8;
        var note = 'Hinterlegte Produktreihe: AFRISO Membran-Sicherheitsventil H, geprüfte Grenzen DN 15/20/25/32/40/50 = 50/100/200/350/600/900 kW bei 2,5 oder 3 bar. Keine Druckinterpolation. Bei einem anderen Fabrikat ausschließlich dessen Zulassung und Datenblatt verwenden. Ventil nicht absperrbar montieren; der Ansprechdruck darf PS des Wärmeerzeugers nicht überschreiten.';
        if (auto) note = 'Ansprechdruck aus statischer Höhe: Fülldruck p_a = stat. Druck + 0,5 bar (mind. 0,8 bar Systemdruck), p₀ = p_a − 0,3 bar, Mindestdruck = (p_a + 0,5) / 0,9, aufgerundet auf die nächste hinterlegte Größe. ' + note;
        if (!approved) note = 'Für den erforderlichen Ansprechdruck von '+fmt(psv,1)+' bar liegt keine geprüfte Produktkennlinie vor. Keine Nennweite automatisch auswählen; Ventil-/Kesselzulassung oder Druckhaltung fachplanerisch prüfen. ' + note;
        if (Q > maxKw) note = 'Über '+fmt(maxKw,0)+' kW: Sonderberechnung beziehungsweise ein zugelassenes Mehrventilkonzept erforderlich. ' + note;
        if (pLow) note = 'Hinweis: Ansprechdruck '+fmt(psv,1)+' bar ist für '+fmt(hstat,0)+' m statische Höhe (statisch '+fmt(pstat,2)+' bar) zu knapp — höheren Ansprechdruck wählen oder „automatisch berechnen". ' + note;
        return { main:{label:approved?'Mindestgröße der hinterlegten Baureihe':'Produktauswahl', value:v?v.dn:(approved?'> DN 50':'Nachweis nötig'), unit:v?('· '+v.conn):''},
          subs:subs, note:note,
          refTitle:'AFRISO H · geprüfte max. Heizleistung bei 2,5/3 bar', refs:[
            {label:'DN 15 / DN 20 / DN 25',value:'50 / 100 / 200 kW'},
            {label:'DN 32 / DN 40 / DN 50',value:'350 / 600 / 900 kW'}
          ] };
      }
      case 'fbhdurch': {
        var area=P(ev.flaeche), dtF=P(ev.dt);
        var stdF = STANDARDS.find(function(s){ return s.id === ev.standard; }) || STANDARDS[5];
        var specF = stdF.w;
        var Qw = area*specF;                       // Heizlast [W]
        var Vlh = dtF>0 ? Qw*0.86/dtF : NaN;       // l/h
        return { main:{label:'Durchflussmenge', value:fmt(Vlh/60,2), unit:'l/min'},
          subs:[
            {label:'Durchfluss', value:fmt(Vlh,0)+' l/h'},
            {label:'Durchfluss', value:fmt(Vlh/1000,3)+' m³/h'},
            {label:'Heizlast', value:fmt(Qw,0)+' W'},
            {label:'spezifische Heizlast', value:fmt(specF,0)+' W/m²'},
            {label:'Fläche', value:fmt(area,1)+' m²'},
            {label:'Spreizung Δt', value:fmt(dtF,1)+' K'}
          ],
          note:'Durchfluss V = Heizlast × 0,86 / Δt. Die Heizlast wird aus Fläche × spezifischer Heizlast (je Baualter/Standard) geschätzt; übliche Spreizung der Fußbodenheizung 5–10 K. Für die Auslegung einzelner Heizkreise zusätzlich die Schleifenlänge (max. ~100 m) und den Durchfluss je Kreis beachten.' };
      }
      case 'pumpe': {
        var sysP = HEIZSYS[ev.sys] || HEIZSYS.heizkoerper;
        var pipeP = LEITUNG[ev.leitung] || LEITUNG.kupfer;
        var Q=P(ev.leistung), L=P(ev.laenge);
        var dt=sysP.dt, z=sysP.zuschlag, R=pipeP.r;
        var Vlh = dt>0 ? Q*860/dt : NaN;           // l/h
        var Lges = 2*L;                            // Vor- + Rücklauf
        var dpRohr = R*Lges;                       // Pa
        var dpTot = dpRohr*(1+z/100);              // Pa inkl. Einzelwiderstände
        var H = dpTot/9810;                        // m (1 m ≈ 9810 Pa)
        return { main:{label:'Förderhöhe-Überschlag', value:fmt(H,2), unit:'m'},
          subs:[
            {label:'Volumenstrom', value:fmt(Vlh,0)+' l/h'},
            {label:'Volumenstrom', value:fmt(Vlh/1000,2)+' m³/h'},
            {label:'Volumenstrom', value:fmt(Vlh/60,1)+' l/min'},
            {label:'Druckverlust gesamt', value:fmt(dpTot/100,0)+' mbar'},
            {label:'angesetzte Spreizung Δt', value:fmt(dt,0)+' K'},
            {label:'spez. Rohrreibung ('+pipeP.label+')', value:fmt(R,0)+' Pa/m'},
            {label:'Rohrlänge gesamt (VL+RL)', value:fmt(Lges,0)+' m'}
          ],
          note:'Vereinfachter Überschlag: das Heizsystem bestimmt die Spreizung Δt und den Zuschlag für Einzelwiderstände, der Leitungstyp die spez. Rohrreibung. Förderhöhe H = Δp/(ρ·g), 1 m ≈ 98 mbar; Volumenstrom V = Q × 860 / Δt; Rohrlänge = 2 × einfache Länge. Betriebspunkt = Volumenstrom bei Förderhöhe — Hocheffizienzpumpen regeln selbst.' };
      }
      case 'kondensat': {
        var fuel = KONDFUELS[ev.brennstoff] || KONDFUELS.erdgasH;
        var Pk=P(ev.leistung), rl=P(ev.ruecklauf);
        var maxC = Pk * fuel.spec;                 // kg/h ≈ l/h, theoretisches Maximum
        var grad = (fuel.dew - rl) / (fuel.dew - 25);
        if (grad < 0) grad = 0; if (grad > 1) grad = 1;
        grad = grad * 0.92;                        // real max. ~92 %
        var estC = maxC * grad;
        return { main:{label:'Geschätzte Kondensatmenge', value:fmt(estC,2), unit:'l/h'},
          subs:[
            {label:'Theoretisches Maximum', value:fmt(maxC,2)+' l/h'},
            {label:'Kondensationsgrad', value:fmt(grad*100,0)+' %'},
            {label:'Abgastaupunkt ('+fuel.label+')', value:fmt(fuel.dew,0)+' °C'},
            {label:'spez. Kondensat', value:fmt(fuel.spec,3)+' kg/kWh'},
            {label:'Feuerungsleistung', value:fmt(Pk,1)+' kW'}
          ],
          note: (rl>=fuel.dew ? 'Rücklauftemperatur liegt über dem Abgastaupunkt — kaum Kondensation, kein echter Brennwertbetrieb. ' : '')
            + 'Schätzung bezogen auf die Feuerungsleistung; Kondensat ≈ 1 kg/l. Die tatsächliche Menge schwankt mit Last und Rücklauftemperatur. Kondensat ist sauer (Erdgas pH ~3–5, Heizöl niedriger) — Einleitung nach örtlicher Satzung bzw. ATV-DVWK-A 251; größere Anlagen mit Neutralisationseinrichtung.' };
      }
      case 'gas': {
        if (ev.modus==='oelduese') return computeFor('oelduese',ev);
        if (ev.modus==='kondensat') return computeFor('kondensat',ev);
        var kw=P(ev.leistung), etaGas=P(ev.eta);
        var qGas=ev.leistungsart==='nutz' ? kw/(etaGas/100) : kw;
        var reg=GAS_HW[ev.region] || GAS_HW.hh;
        var hw=reg.hw;
        var lmin = hw>0 ? qGas*16.667/hw : NaN;
        var m3h = lmin*0.06;                       // l/min × 60 / 1000
        return { main:{label:'Gasverbrauch', value:fmt(lmin,1), unit:'l/min'},
          subs:[
            {label:'Volumenstrom', value:fmt(m3h,2)+' m³/h'},
            {label:'Heizwert ('+reg.label+')', value:fmt(hw,1)+' kWh/m³'},
            {label:'Feuerungsleistung / Nennwärmebelastung', value:fmt(qGas,1)+' kW'},
            {label:ev.leistungsart==='nutz'?'abgegebene Nutzleistung':'Eingabe Feuerungsleistung', value:fmt(kw,1)+' kW'}
          ],
          note:(ev.leistungsart==='nutz'?'Die Nutzleistung wird über den eingegebenen Wirkungsgrad zuerst in die Feuerungsleistung umgerechnet. ':'')+'Formel: l/min = Feuerungsleistung × 16,667 / Heizwert. Die Heizwerte sind regionale Richtwerte — den Abrechnungsbrennwert nennt der Gasnetzbetreiber.' };
      }
      case 'oelduese': {
        var PnO=P(ev.leistung), etaO=P(ev.eta), prO=P(ev.druck);
        var HI=11.86, RHO=0.845, GAL=3.785;        // Heizöl EL: Hi [kWh/kg], Dichte [kg/l], US-Gallone [l]
        var QF = etaO>0 ? PnO/(etaO/100) : NaN;    // Feuerungsleistung
        var kgh = QF/HI;                           // Öldurchsatz [kg/h]
        var lhO = kgh/RHO;                         // Öldurchsatz [l/h]
        var facO = prO>0 ? Math.sqrt(prO/7) : NaN; // Düsen bei 7 bar kalibriert: Durchsatz ∝ √(p/7)
        var gphNenn = (isFinite(facO) && facO>0) ? (lhO/GAL)/facO : NaN;
        // nächstliegende Normgröße wählen (Feinabstimmung über den Pumpendruck)
        var duesen=[0.30,0.35,0.40,0.45,0.50,0.55,0.60,0.65,0.75,0.85,1.00,1.10,1.20,1.25,1.35,1.50,1.65,1.75,2.00,2.25,2.50,2.75,3.00,3.50,4.00,4.50,5.00,5.50,6.00];
        function nearestDuese(x) {
          if (!isFinite(x)) return null;
          var b=null, diff=Infinity;
          duesen.forEach(function(s){ var d=Math.abs(s-x); if (d<diff) { diff=d; b=s; } });
          return b;
        }
        var noteCommon = 'Öldüsen sind bei 7 bar kalibriert (Angabe in US-Gallonen/h); der Durchsatz steigt mit √(Druck/7 bar). Rechenwerte: Heizöl EL Hi ≈ 11,86 kWh/kg, Dichte ≈ 0,845 kg/l, 1 US-Gallone = 3,785 l. Es wird die nächstliegende Normgröße vorgeschlagen — die Feinabstimmung der Leistung erfolgt über den Pumpendruck. Sprühwinkel und Sprühbild nach Brennkammer und Brenner-Vorgabe wählen; Endkontrolle immer per Abgasmessung (CO₂, Rußzahl) je Stufe und ggf. Ölmengenmessung.';

        // ---------- 2-stufiger Brenner (Zweidüsenbrenner) ----------
        if (ev.stufen === '2') {
          var split = P(ev.teilung)/100;
          if (!(split > 0 && split < 1)) split = 0.6;
          var g1soll = gphNenn*split, g2soll = gphNenn*(1-split);
          var d1 = nearestDuese(g1soll), d2 = nearestDuese(g2soll);
          var kgh1 = d1!=null ? d1*facO*GAL*RHO : NaN;   // Düse 1 allein = Stufe 1
          var kgh2 = d2!=null ? d2*facO*GAL*RHO : NaN;   // Düse 2 schaltet zu
          var Pn1 = kgh1*HI*(etaO/100);
          var PnVoll = (kgh1+kgh2)*HI*(etaO/100);
          var anteil1 = PnO>0 ? Pn1/PnO*100 : NaN;
          var teilLow = isFinite(anteil1) && anteil1 < 58;
          return { main:{label:'Düse 1 + Düse 2 (Stufe 1 / Zuschaltung)', value: (d1!=null&&d2!=null) ? fmt(d1,2)+' + '+fmt(d2,2) : '–', unit:'gph'},
            subs:[
              {label:'Rechnerisch Düse 1 / Düse 2 (7-bar-Basis)', value:fmt(g1soll,2)+' / '+fmt(g2soll,2)+' gph'},
              {label:'Stufe 1 — Kesselleistung (nur Düse 1)', value:fmt(Pn1,1)+' kW ('+fmt(anteil1,0)+' %)'},
              {label:'Volllast — Kesselleistung (beide Düsen)', value:fmt(PnVoll,1)+' kW'},
              {label:'Durchsatz Stufe 1 / Volllast bei '+fmt(prO,0)+' bar', value:fmt(kgh1,2)+' / '+fmt(kgh1+kgh2,2)+' kg/h'},
              {label:'Feuerungsleistung (Soll, Volllast)', value:fmt(QF,1)+' kW'},
              {label:'Benötigter Öldurchsatz (Volllast)', value:fmt(kgh,2)+' kg/h ('+fmt(lhO,2)+' l/h)'}
            ],
            note: (teilLow ? 'Achtung: Stufe 1 liegt unter ca. 60 % der Nennleistung — nach Buderus-/Viessmann-Vorgabe Teillast nicht kleiner wählen (Gefahr zu niedriger Abgastemperatur: Kondensat/Versottung in Kessel und Schornstein). Größere Düse 1 oder Aufteilung 65/35 wählen. ' : '')
              + 'Zweidüsenbrenner: In Stufe 1 läuft nur Düse 1, bei Volllast laufen beide Düsen zusammen. Aufteilung nach Kesselhersteller-Vorgabe (Buderus/Viessmann: Stufe 1 ≈ 60–70 % der Nennlast, nie unter ~60 %). Verbindlich ist die Düsentabelle in der Brenner-/Kesselanleitung. '
              + noteCommon,
            refTitle:'Sprühwinkel & Sprühbild', refs:[
              {label:'45° — lange, schmale Brennkammer', value:'z. B. Stahlkessel'},
              {label:'60° — Standard', value:'die meisten Gebläsebrenner'},
              {label:'80° — kurze, breite Brennkammer', value:'z. B. Gusskessel'},
              {label:'Sprühbild', value:'H = Hohlkegel · S = Vollkegel · B = universal'}
            ] };
        }

        // ---------- 1-stufiger Brenner ----------
        var best = nearestDuese(gphNenn);
        var tooBig = isFinite(gphNenn) && gphNenn > duesen[duesen.length-1];
        var kghBest = best!=null ? best*facO*GAL*RHO : NaN;   // Durchsatz der gewählten Düse beim eingestellten Druck
        var QFbest = kghBest*HI;
        var PnBest = QFbest*(etaO/100);
        return { main:{label:'Empfohlene Düsengröße', value: (best!=null && !tooBig) ? fmt(best,2) : (tooBig ? '> 6,00' : '–'), unit:'gph'},
          subs:[
            {label:'Rechnerische Düsengröße (7-bar-Basis)', value:fmt(gphNenn,2)+' gph'},
            {label:'Benötigter Öldurchsatz', value:fmt(kgh,2)+' kg/h'},
            {label:'Benötigter Öldurchsatz', value:fmt(lhO,2)+' l/h'},
            {label:'Feuerungsleistung (Soll)', value:fmt(QF,1)+' kW'},
            {label:'Durchsatz gewählte Düse bei '+fmt(prO,0)+' bar', value:fmt(kghBest,2)+' kg/h'},
            {label:'Feuerungsleistung mit gewählter Düse', value:fmt(QFbest,1)+' kW'},
            {label:'Kesselleistung mit gewählter Düse', value:fmt(PnBest,1)+' kW'}
          ],
          note: (tooBig ? 'Über 6,00 gph: Größe außerhalb der üblichen Baureihe — Herstellerprogramm bzw. Zweidüsen-/Zweistoffbrenner prüfen. ' : '')
            + noteCommon,
          refTitle:'Sprühwinkel & Sprühbild', refs:[
            {label:'45° — lange, schmale Brennkammer', value:'z. B. Stahlkessel'},
            {label:'60° — Standard', value:'die meisten Gebläsebrenner'},
            {label:'80° — kurze, breite Brennkammer', value:'z. B. Gusskessel'},
            {label:'Sprühbild', value:'H = Hohlkegel · S = Vollkegel · B = universal'}
          ] };
      }
      case 'frost': {
        var T=P(ev.frost), vol2=P(ev.vol);
        var fp=FROST_PRODUCTS[ev.produkt] || FROST_PRODUCTS.tyfocorl;
        var rawPct=pctFor(T,fp.table);
        var pct=Math.max(rawPct,fp.min);
        var gly=vol2*pct/100, wat=vol2-gly;
        var lastFp=fp.table[fp.table.length-1][1], capped=T<lastFp;
        var corrosionMin=pct>rawPct+0.01;
        return { main:{label:'Benötigter Glykolanteil', value:fmt(pct,0), unit:'%'},
          subs:[
            {label:'Frostschutz (Ziel)', value:fmt(T,0)+' °C'},
            {label:'Konzentrat', value:fmt(gly,1)+' l'},
            {label:'Wasser', value:fmt(wat,1)+' l'},
            {label:'Kennlinie',value:fp.source+' · Vol.-%'},
            {label:'Anlagenvolumen', value:fmt(vol2,0)+' l'}
          ],
          note:(capped?'Ziel liegt unter dem letzten hinterlegten Gefrierpunkt ('+fmt(lastFp,1)+' °C); Hersteller direkt prüfen. ':'')
            +(corrosionMin?'Die Mindestkonzentration des Produkts ist für den Korrosionsschutz maßgebend und liegt über der reinen Frostschutzanforderung. ':'')
            +'Berechnung aus der Produktkennlinie '+fp.source+'; Konzentration in Volumenprozent. Bei TYFOCOR L sind in Solarthermie mindestens 40 Vol.-% vorgesehen. Nicht mit anderen Wärmeträgern mischen; reale Konzentration per geeignetem Refraktometer prüfen.' };
      }
      case 'rohrvol': {
        if (ev.modus==='ausstoss') return computeFor('ausstoss',ev);
        if (ev.modus==='dimension') return computeFor('rohrdim',ev);
        var secs = rohrSections();
        var total=0, totalLen=0, subs=[];
        secs.forEach(function(s, i){
          var di=P(s.di), len=P(s.len);
          var perM=Math.PI*Math.pow(di/2000,2)*1000;
          var v=perM*len;
          total+=v; totalLen+=len;
          var dLab = rohrDimLabel(s);
          subs.push({label:'Abschnitt '+(i+1)+' ('+(dLab ? dLab+', ' : 'Ø ')+fmt(di,1)+' mm × '+fmt(len,2)+' m)', value:fmt(v,2)+' l'});
        });
        subs.push({label:'Gesamtlänge', value:fmt(totalLen,2)+' m'});
        return { main:{label:'Gesamt-Wasserinhalt', value:fmt(total,2), unit:'l'},
          subs:subs,
          note:'V = π/4 × d² × L je Abschnitt (Innendurchmesser), anschließend summiert.' };
      }
      case 'gefaelle': {
        var len2=P(ev.len), gef=P(ev.gef);
        var dropCm=len2*gef;
        var deg=Math.atan(gef/100)*180/Math.PI;
        return { main:{label:'Höhenunterschied', value:fmt(dropCm,1), unit:'cm'},
          subs:[
            {label:'Gefälle', value:fmt(gef,1)+' cm/m'},
            {label:'Gefälle (Winkel)', value:fmt(deg,2)+' °'},
            {label:'Höhenunterschied', value:fmt(dropCm/100,3)+' m'},
            {label:'Länge', value:fmt(len2,2)+' m'}
          ],
          note:'Reine Geometrieberechnung. Das erforderliche Mindest-/Höchstgefälle hängt von Leitungsart, Nennweite, Füllungsgrad und der vollständigen Entwässerungsplanung nach DIN EN 12056 / DIN 1986-100 ab; kein pauschaler Bereich gilt für alle Abwasserleitungen.' };
      }
      case 'wtdurch': {
        var Qwt=P(ev.leistung), dtWt=P(ev.dt);
        var VlminWt = dtWt>0 ? Qwt*860/(60*dtWt) : NaN;   // l/min
        var VlhWt = VlminWt*60;
        return { main:{label:'Einzustellender Durchfluss', value:fmt(VlminWt,1), unit:'l/min'},
          subs:[
            {label:'Durchfluss', value:fmt(VlhWt,0)+' l/h'},
            {label:'Durchfluss', value:fmt(VlhWt/1000,3)+' m³/h'},
            {label:'Wärmetauscher-Leistung', value:fmt(Qwt,1)+' kW'},
            {label:'Spreizung Δt', value:fmt(dtWt,0)+' K'}
          ],
          note:'l/min = Leistung × 860 / (60 × Δt). Bei Δt = 50 K (z. B. Trinkwasser 10 → 60 °C) entspricht das Leistung × 860 / 3000. Durchfluss am Wärmetauscher des Speicherladesystems entsprechend einstellen (Strangregulierventil / Pumpenstufe).' };
      }
      case 'taupunkt': {
        var t=P(ev.temp), rh=P(ev.rh), surf=P(ev.surf);
        var a=17.62, b=243.12;
        var g=Math.log(Math.max(rh,0.01)/100)+a*t/(b+t);
        var td=b*g/(a-g);
        var es=6.112*Math.exp(a*t/(b+t));
        var ah=216.7*(rh/100*es)/(273.15+t);
        var cond = surf<=td;
        return { main:{label:'Taupunkttemperatur', value:fmt(td,1), unit:'°C'},
          subs:[
            {label:'Oberflächentemperatur', value:fmt(surf,1)+' °C'},
            {label:'absolute Feuchte', value:fmt(ah,1)+' g/m³'},
            {label:'Lufttemperatur', value:fmt(t,1)+' °C'},
            {label:'rel. Luftfeuchte', value:fmt(rh,0)+' %'}
          ],
          note: (t<-45||t>60?'Die Magnus-Näherung liegt außerhalb ihres üblichen Gebäudebereichs; Ergebnis nur eingeschränkt verwenden. ':'')+(cond
            ? ('Achtung: Oberfläche ('+fmt(surf,1)+' °C) liegt auf/unter dem Taupunkt — Kondensat bildet sich.')
            : ('Kein Kondensat: Oberfläche liegt '+fmt(surf-td,1)+' K über dem Taupunkt.')) };
      }
      case 'einheiten': {
        var kat=ev.kategorie, wert=P(ev.wert);
        if (kat==='temperatur') {
          var list=['°C','°F','K'];
          var u0=list.indexOf(ev.einheit)>=0?ev.einheit:'°C';
          var toC=function(uu,v){ return uu==='°C'?v: uu==='°F'?(v-32)*5/9 : v-273.15; };
          var fromC=function(uu,c){ return uu==='°C'?c: uu==='°F'?c*9/5+32 : c+273.15; };
          var c0=toC(u0,wert);
          return { main:null, subs:list.filter(function(x){return x!==u0;}).map(function(x){return {label:x, value:f2(fromC(x,c0))};}), note:'Eingabe: '+f2(wert)+' '+u0 };
        }
        var U=UNITS[kat].units;
        var u = U.find(function(x){return x[0]===ev.einheit;}) ? ev.einheit : U[0][0];
        var f0 = U.find(function(x){return x[0]===u;})[1];
        var base=wert*f0;
        return { main:null, subs:U.filter(function(x){return x[0]!==u;}).map(function(x){return {label:x[0], value:f2(base/x[1])};}), note:'Eingabe: '+f2(wert)+' '+u };
      }
      case 'mwst': {
        var netto=P(ev.netto), mw=P(ev.mwst), auf=P(ev.aufschlag);
        var n2=netto*(1+auf/100), bet=n2*mw/100, br=n2+bet;
        var subs=[
          {label:'Nettobetrag', value:fmt(n2,2)+' €'},
          {label:'MwSt ('+fmt(mw,0)+' %)', value:fmt(bet,2)+' €'}
        ];
        if (auf>0) subs.unshift({label:'Aufschlag ('+fmt(auf,0)+' %)', value:'+ '+fmt(n2-netto,2)+' €'});
        return { main:{label:'Bruttobetrag', value:fmt(br,2), unit:'€'}, subs:subs, note: auf>0?'Aufschlag wird auf den Nettobetrag vor MwSt gerechnet.':'' };
      }
      case 'cop': {
        if (ev.modus==='jaz') return computeFor('jaz',ev);
        if (ev.modus==='bivalenz') return computeFor('bivalenz',ev);
        if (ev.modus==='puffer') return computeFor('puffer',ev);
        if (ev.modus==='heizkurve') return computeFor('heizkurve',ev);
        var wt = WPTYP[ev.wptyp] || WPTYP.luftwasser;
        var src=P(ev.src), sink=P(ev.sink), g=wt.guete;
        var Ts=src+273.15, Tv=sink+273.15;
        var carnot = Tv>Ts ? Tv/(Tv-Ts) : NaN;
        var copv = carnot*g/100;
        return { main:{label:'Geschätzter COP', value:fmt(copv,2), unit:''},
          subs:[
            {label:'Carnot-COP', value:fmt(carnot,2)},
            {label:'Temperaturhub', value:fmt(sink-src,1)+' K'},
            {label:'Gütegrad ('+wt.label+')', value:fmt(g,0)+' %'},
            {label:'Quelle / Vorlauf', value:fmt(src,1)+' / '+fmt(sink,1)+' °C'}
          ],
          note:'COP = Carnot-Wirkungsgrad × Gütegrad. Carnot-COP = T_VL / (T_VL − T_Quelle) in Kelvin. Der Gütegrad wird je Bauart angesetzt (Luft/Wasser ~0,42, Sole/Wasser ~0,47, Wasser/Wasser ~0,52, Luft/Luft ~0,38) und beschreibt die Maschinenqualität gegenüber dem idealen Prozess. Je kleiner der Temperaturhub (niedrige Vorlauftemperatur, hohe Quellentemperatur), desto höher der COP.' };
      }
      case 'jaz': {
        var vgl = VERGLEICH[ev.vergleich] || VERGLEICH.gas;
        var bedarf=P(ev.bedarf), jz=P(ev.jz), strom=P(ev.strom), bren=P(ev.brennstoff), eta=P(ev.eta);
        var sWP = jz>0 ? bedarf/jz : NaN;
        var kWP = sWP*strom/100;
        var brenKwh = eta>0 ? bedarf/(eta/100) : NaN;
        var kV = brenKwh*bren/100;
        var diff = kV-kWP;
        return { main:{label: diff>=0?'Jährliche Ersparnis':'Jährliche Mehrkosten', value:fmt(Math.abs(diff),0), unit:'€/a'},
          subs:[
            {label:'Stromkosten Wärmepumpe', value:fmt(kWP,0)+' €/a'},
            {label:'Kosten Vergleich ('+vgl.label+')', value:fmt(kV,0)+' €/a'},
            {label:'Strombedarf WP', value:fmt(sWP,0)+' kWh/a'},
            {label:'Endenergie Vergleich', value:fmt(brenKwh,0)+' kWh/a'}
          ],
          note:'Stromkosten = Heizwärmebedarf / JAZ × Strompreis. Vergleichsheizung = Bedarf / Wirkungsgrad × Energiepreis. Die hinterlegten Preise sind Richtwerte und über die Dropdown-Auswahl vorbelegt — jederzeit überschreibbar. Nur reine Energiekosten, ohne Investition, Wartung und Grundgebühren.' };
      }
      case 'bivalenz': {
        var HL=P(ev.hl), Tn=P(ev.tnorm), Hg=P(ev.hgrenze), Pwp=P(ev.pwp);
        var span = Hg-Tn;
        var Tbiv = (HL>0 && span!==0) ? Hg-(Pwp/HL)*span : NaN;
        if (Tbiv < Tn) Tbiv = Tn;
        var heizstab = Math.max(0, HL-Pwp);
        var deckung = HL>0 ? Math.min(100, Pwp/HL*100) : NaN;
        var mono = Pwp >= HL;
        return { main:{label:'Bivalenzpunkt-Überschlag', value:mono?'keiner':fmt(Tbiv,1), unit:mono?'':'°C'},
          subs:[
            {label:'Betriebsweise', value: mono?'monovalent':'bivalent'},
            {label:'Erf. Heizstab-Leistung', value:fmt(heizstab,1)+' kW'},
            {label:'WP-Deckung am Auslegungspunkt', value:fmt(deckung,0)+' %'},
            {label:'WP-Heizleistung', value:fmt(Pwp,1)+' kW'},
            {label:'Gebäude-Heizlast', value:fmt(HL,1)+' kW'}
          ],

  // ---------- DOM-Hilfen ----------
  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === 'style') e.setAttribute('style', attrs[k]);
        else if (k === 'class') e.className = attrs[k];
        else if (k === 'text') e.textContent = attrs[k];
        else if (k.slice(0,2) === 'on' && typeof attrs[k] === 'function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(function(c){
        if (c == null) return;
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return e;
  }

    if (id!=='home' && !TOOLS.some(function(t){return t.id===id;})) id='home';
    var q=raw.indexOf('?d='), data=q>=0?decodeShareData(decodeURIComponent(raw.slice(q+3))):null;
    return {id:id,requested:requested,legacy:legacy,data:data,raw:raw};

    }
    if (r.data && r.raw!==appliedShareHash && (r.data.id===r.id || r.data.id===r.requested) && isPlainObject(r.data.vals)) {
      try {
        var clean=sanitizeImportedVals(r.data.vals);

        if (r.legacy && COMBINED_DEFAULTS[r.id]) { normalizeCombinedState(state.vals,r.id); state.vals[r.id].modus=r.legacy.modus; persist(); }

    if (lab) kids.push(lab);
    var b = el('button', {

    b.addEventListener('click', function (ev) {
      ev.stopPropagation();      // darf die Karte darunter nicht öffnen

      } else {
        var mt = state.vals.mag.art;
        if (!isPlainObject(state.vals.mag.profiles[mt])) state.vals.mag.profiles[mt] = {};
        state.vals.mag.profiles[mt][key] = val;
      }
      persist(); renderResult(id); return;
    }
    if (COMBINED_DEFAULTS[id]) {
      normalizeCombinedState(state.vals,id);
      if (key==='modus') {
        var modes=Object.keys(COMBINED_DEFAULTS[id].profiles);
        state.vals[id].modus=modes.indexOf(val)>=0?val:COMBINED_DEFAULTS[id].modus;

      persist(); renderResult(id); return;

    });
    TOOLS.forEach(function(t){
      var id=t.id; if (id==='mag') return;

      if (COMBINED_DEFAULTS[id]) {
        normalizeCombinedState(source,id); src=source[id];
        var spec=COMBINED_DEFAULTS[id], modes=Object.keys(spec.profiles);
        var mode=modes.indexOf(src.modus)>=0?src.modus:spec.modus;
        var combined={modus:mode,profiles:{}};
        modes.forEach(function(m){
          var def=spec.profiles[m], sp=isPlainObject(src.profiles[m])?src.profiles[m]:{}, dp={};
          Object.keys(def).forEach(function(k){
            if (k==='sections') {
              var sections=Array.isArray(sp.sections)?sp.sections.slice(0,100):[];
              dp.sections=sections.filter(isPlainObject).map(function(s){return {dim:typeof s.dim==='string'?s.dim.slice(0,40):'manual',di:isFinite(N(s.di))?N(s.di):16,len:isFinite(N(s.len))?N(s.len):5};});
              if (!dp.sections.length) delete dp.sections;
            } else if (sp[k]!=null) dp[k]=cleanScalar(sp[k],def[k]);
          });
          combined.profiles[m]=dp;
        });
        out[id]=combined;
        return;
      }
      if (id==='rohrvol') {
        var sections=Array.isArray(src.sections)?src.sections.slice(0,100):[];
        out.rohrvol={sections:sections.filter(isPlainObject).map(function(s){
          return {dim:typeof s.dim==='string'?s.dim.slice(0,40):'manual',di:isFinite(N(s.di))?N(s.di):16,len:isFinite(N(s.len))?N(s.len):5};
        })};
        if (!out.rohrvol.sections.length) delete out.rohrvol;
        return;
      }
      if (id==='heizlast') {
        var rooms=Array.isArray(src.rooms)?src.rooms.slice(0,100):[];
        out.heizlast={
          standard:typeof src.standard==='string'?src.standard.slice(0,40):DEFAULTS.heizlast.standard,
          hoehe:isFinite(N(src.hoehe))?N(src.hoehe):DEFAULTS.heizlast.hoehe,
          rooms:rooms.filter(isPlainObject).map(function(r){ return {name:typeof r.name==='string'?r.name.slice(0,100):'',flaeche:isFinite(N(r.flaeche))?N(r.flaeche):10}; })
        };
        if (!out.heizlast.rooms.length) out.heizlast.rooms=DEFAULTS.heizlast.rooms.map(copyOwn);

      }
      var defaults=DEFAULTS[id]||{}, dst={};
      Object.keys(defaults).forEach(function(k){ if (src[k]!=null) dst[k]=cleanScalar(src[k],defaults[k]); });
      out[id]=dst;
    });
    return out;
  }

  function importData() {
    var inp = el('input', { type:'file', accept:'.json,application/json', style:'display:none;' });
    inp.addEventListener('change', function(){
      var file = inp.files && inp.files[0];
      if (!file) return;
      if (file.size > 2*1024*1024) { alert('Import fehlgeschlagen: Die Sicherung ist größer als 2 MB.'); return; }
      var rd = new FileReader();
      rd.onload = function(){
        var previous={vals:state.vals,favs:state.favs,theme:state.theme,themeChosen:themeChosen};
        try {
          var d = JSON.parse(rd.result);
          if (!isPlainObject(d) || d.app !== 'shk-rechner' || !isPlainObject(d.vals) || (d.version!=null && (!isFinite(N(d.version)) || N(d.version)>4))) {
            throw new Error('format');
          }
          state.vals = sanitizeImportedVals(d.vals);
          // Favoriten sind optional — ältere Sicherungen (Version 1) haben sie noch nicht
          if (d.favs && typeof d.favs === 'object') state.favs = sanitizeFavs(d.favs);
          if (d.theme === 'light' || d.theme === 'dark') { state.theme = d.theme; themeChosen = true; }
          applyTheme(); render(); persist(); showToast('Sicherung erfolgreich geladen.');
        } catch (e) {
          state.vals=previous.vals; state.favs=previous.favs; state.theme=previous.theme; themeChosen=previous.themeChosen;
          applyTheme(); render();
          alert('Import fehlgeschlagen: Die Datei ist keine gültige SHK-Rechner-Sicherung.');
        }
      };
      rd.readAsText(file);
    });

  }

  // ---------- PDF-Export (eigener, abhängigkeitsfreier Generator, Helvetica/WinAnsi) ----------
  function pdfText(s) {
    var rep = {'Δ':'d','π':'pi','√':'sqrt','₀':'0','₁':'1','₂':'2','₃':'3','ₑ':'e','ⁿ':'n',
      '→':'->','…':'...','≤':'<=','≥':'>=','„':'"','“':'"','”':'"','‚':"'",'‘':"'",'’':"'",
      '–':'-','—':'-','−':'-','•':'-','€':'EUR','≈':'~','β':'beta','ρ':'rho'};
    s = String(s); var out = '';
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (rep[ch] != null) { out += rep[ch]; continue; }
      var cc = ch.charCodeAt(0);
      out += (cc < 0x80 || (cc >= 0xA0 && cc <= 0xFF)) ? ch : '?';
    }
    return out;
  }
  function pdfEsc(s) { return pdfText(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
  function pdfWrap(text, max) {
    var words = String(text).split(/\s+/), lines = [], cur = '';
    words.forEach(function(w){
      while (w.length>max) { if (cur) { lines.push(cur); cur=''; } lines.push(w.slice(0,max)); w=w.slice(max); }
      if ((cur+' '+w).trim().length > max) { if (cur) lines.push(cur); cur = w; } else cur = (cur?cur+' ':'')+w;
    });
    if (cur) lines.push(cur); return lines;
  }
  function buildPdf(doc) {
    var W=595.28,H=841.89,M=50,BOTTOM=54,pages=[],c='',y=H-58,pageNo=0;
    function gray(g){ c+=g+' '+g+' '+g+' rg\n'; }
    function t(x,yy,sz,f,str){ c+='BT /'+f+' '+sz+' Tf 1 0 0 1 '+x.toFixed(2)+' '+yy.toFixed(2)+' Tm ('+pdfEsc(str)+') Tj ET\n'; }
    function startPage(){
      pageNo++; c=''; y=H-58;
      gray(0); t(M,y,pageNo===1?18:12,'F2',doc.title+(pageNo===1?'':' - Fortsetzung')); y-=pageNo===1?22:18;
      if (doc.subtitle) { gray(0.45); t(M,y,9,'F1',doc.subtitle); y-=18; }
    }
    function finishPage(){ if (c) pages.push(c); }
    function ensure(space){ if (y-space<BOTTOM) { finishPage(); startPage(); } }
    function wrapped(x,lines,sz,font,step,g){ gray(g); lines.forEach(function(ln,i){ t(x,y-i*step,sz,font,ln); }); }
    startPage();
    doc.rows.forEach(function(r){
      if (r.sep) { ensure(14); gray(0.8); c+=M.toFixed(2)+' '+(y+5).toFixed(2)+' m '+(W-M).toFixed(2)+' '+(y+5).toFixed(2)+' l 0.5 w S\n'; y-=12; return; }
      if (r.head) { ensure(22); gray(0.45); t(M,y,9,'F2',String(r.head).toUpperCase()); y-=18; return; }
      var left=pdfWrap(r.label||'',r.main?42:46), right=pdfWrap(r.value||'',r.main?24:31);
      var step=r.main?15:13, lines=Math.max(left.length,right.length), need=lines*step+7;
      ensure(need);
      wrapped(M,left,r.main?12:10,r.main?'F2':'F1',step,r.main?0:0.3);
      wrapped(W-M-205,right,r.main?12:10,r.main?'F2':'F1',step,0);
      y-=need;
    });
    if (doc.note) {
      var noteLines=pdfWrap(doc.note,98); y-=4;
      noteLines.forEach(function(ln){ ensure(13); gray(0.45); t(M,y,9,'F1',ln); y-=12; });
    }
    finishPage();
    pages=pages.map(function(stream,i){
      return stream+'0.45 0.45 0.45 rg\nBT /F1 8 Tf 1 0 0 1 '+M.toFixed(2)+' 26 Tm (SHK Rechner) Tj ET\nBT /F1 8 Tf 1 0 0 1 '+(W-M-72).toFixed(2)+' 26 Tm (Seite '+(i+1)+' / '+pages.length+') Tj ET\n';
    });
    var objs=[];
    var f1=3+pages.length*2, f2=f1+1;
    var kids=[]; pages.forEach(function(_,i){kids.push((3+i*2)+' 0 R');});
    objs.push('<< /Type /Catalog /Pages 2 0 R >>');
    objs.push('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+pages.length+' >>');
    pages.forEach(function(stream,i){
      var contentObj=4+i*2;
      objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W.toFixed(2)+' '+H.toFixed(2)+'] /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> /Contents '+contentObj+' 0 R >>');
      objs.push('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');
    });
    objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    var pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n', offs = [];
    objs.forEach(function(o, i){ offs.push(pdf.length); pdf += (i+1)+' 0 obj\n'+o+'\nendobj\n'; });
    var xref = pdf.length;
    pdf += 'xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
    offs.forEach(function(o){ pdf += ('0000000000'+o).slice(-10)+' 00000 n \n'; });
    pdf += 'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
    return pdf;
  }
  function downloadPdf(name, bytes) {
    var arr = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i) & 0xff;
    var url = URL.createObjectURL(new Blob([arr], { type:'application/pdf' }));
    var a = el('a', { href:url, download:name });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function buildToolPdfDoc(id) {
    var tool = TOOLS.find(function(t){ return t.id === id; });
    var ev = effVals(id);
    if (id === 'einheiten') {
      var list = ev.kategorie==='temperatur' ? ['°C','°F','K'] : (UNITS[ev.kategorie]?UNITS[ev.kategorie].units.map(function(u){return u[0];}):[]);
      if (list.indexOf(ev.einheit) < 0) ev.einheit = list[0];
    }
    var rows = [{ head:'Eingaben' }];
    if (id === 'rohrvol') {
      rohrSections().forEach(function(s, i){
        var dLab = rohrDimLabel(s);
        rows.push({ label:'Abschnitt '+(i+1)+(dLab ? ' — '+dLab : ' (Innen-Ø)'), value: fmt(P(s.di),1)+' mm × '+fmt(P(s.len),2)+' m' });
      });
    } else if (id === 'heizlast') {
      var h = ensureHeizlast();
      var std = STANDARDS.find(function(s){ return s.id === h.standard; });
      rows.push({ label:'Baujahr / Standard', value: std ? std.label : String(h.standard) });
      rows.push({ label:'Raumhöhe', value: fmt(P(h.hoehe),2)+' m' });
      h.rooms.forEach(function(r, i){ rows.push({ label:(r.name||('Raum '+(i+1))), value: fmt(P(r.flaeche),1)+' m²' }); });
    } else {
      fieldDefs(id, ev).forEach(function(f){
        var val = ev[f.key];
        if (f.type === 'select' && f.options) {
          var opt = f.options.find(function(o){ return String(Array.isArray(o)?o[0]:o) === String(val); });
          if (opt) val = Array.isArray(opt) ? opt[1] : opt;
        }
        rows.push({ label:f.label, value: String(val)+(f.unit?' '+f.unit:'') });
      });
    }
    rows.push({ sep:true }, { head:'Ergebnis' });
    var validation=validateFor(id,ev), res={note:''};
    if (!validation.ok) {
      validation.errors.forEach(function(er){ rows.push({label:'Eingabefehler',value:er.message}); });
      res.note='Keine Berechnung: Bitte die markierten Eingaben korrigieren.';
    } else {
      res=computeFor(id,ev);
      if (res.main) rows.push({ main:true, label:res.main.label, value:res.main.value+' '+res.main.unit });
      (res.subs || []).forEach(function(r){ rows.push({ label:r.label, value:r.value }); });
      if (res.refs && res.refs.length) {
        rows.push({ head: res.refTitle || 'Richtwerte' });
        res.refs.forEach(function(r){ rows.push({ label:r.label, value:r.value }); });
      }
    }
    var method=methodFor(id);
    rows.push({head:'Einordnung und Quellenstand'});
    rows.push({label:'Berechnungsart',value:method.kind});
    rows.push({label:'Grundlage',value:method.basis});
    rows.push({label:'Prüfstand',value:'08/2026'});
    return {
      title: tool.name,
      subtitle: cats[tool.cat].label + ' · SHK Rechner · ' + new Date().toLocaleDateString('de-DE'),
      rows: rows,
      note: res.note || ''
    };
  }
  function downloadCurrentPdf() {
    if (state.view === 'home') return;
    var check=validateFor(state.view,effVals(state.view));
    if (!check.ok) { alert('PDF-Export nicht möglich: Bitte zuerst die markierten Eingaben korrigieren.'); return; }
    var tool = TOOLS.find(function(t){ return t.id === state.view; });
    var name = ('SHK ' + tool.name).replace(/[\\/:*?"<>|]+/g, '-') + '.pdf';
    downloadPdf(name, buildPdf(buildToolPdfDoc(state.view)));
  }

  function renderQuickNav() {

      ]));
    });
    return nav;

  // Geräteabhängige Anleitung: App-Symbol auf dem Startbildschirm anlegen
  function renderHomeHint() {
    var ua = navigator.userAgent;
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    var current = isIOS ? 'ios' : (isAndroid ? 'android' : 'desktop');
    var steps = [
      { id:'android', title:'Android (Chrome)',      text:'Datei in Chrome öffnen → Menü ⋮ oben rechts → „Zum Startbildschirm hinzufügen". Es entsteht ein App-Symbol, das den Rechner direkt öffnet.' },
      { id:'ios',     title:'iPhone / iPad (Safari)', text:'Seite in Safari öffnen (aus der Dateien-Vorschau heraus geht es nicht — z. B. über einen Cloud-Link oder eine App wie „Documents") → Teilen-Symbol → „Zum Home-Bildschirm".' },
      { id:'desktop', title:'PC (Chrome / Edge)',     text:'Browser-Menü → „Speichern und teilen" bzw. „Weitere Tools" → „Verknüpfung erstellen" — oder eine Datei-Verknüpfung auf den Desktop legen.' }
    ];
    steps.sort(function(a, b){ return (a.id===current ? -1 : 0) - (b.id===current ? -1 : 0); });
    var det = el('details', { class:'tool-explain home-hint' });
    det.appendChild(el('summary', { text:'Zum Startbildschirm anheften — so geht\'s' }));

  }

  // Baut eine Gruppe (Kopfzeile + Kartenraster). key steuert das Ein-/Ausklappen.
  function toolGroup(key, label, col, iconName, tools, forceOpen, showCat, emptyText) {
    var isCollapsed = !forceOpen && !!state.collapsed[key];
    var head = el('button', {
      class:'group-head' + (isCollapsed ? ' collapsed' : ''),
      style:'--cat:'+col+';',
      'aria-expanded': String(!isCollapsed),
      title: isCollapsed ? 'Gruppe aufklappen' : 'Gruppe zuklappen',
      onClick:function(){ toggleGroup(key); }
    }, [
      el('span', { class:'group-dot' }, [ icon(iconName) ]),
      el('span', { class:'group-label', text:label }),
      el('span', { class:'group-count', text:String(tools.length) }),
      el('span', { class:'group-chev', text:'▾', 'aria-hidden':'true' })
    ]);
    var children = [head];
    if (!isCollapsed) {
      var grid = el('div', { class:'grid' });
      if (!tools.length && emptyText) grid.appendChild(el('div', { class:'fav-empty', text:emptyText }));
      tools.forEach(function(t,index){ grid.appendChild(toolCard(t, showCat, index)); });
      children.push(grid);
    }
    return el('section', { class:'group', id:'group-'+key }, children);
  }

  function renderHomeGroups() {
    var wrap = document.getElementById('home-groups');
    if (!wrap) return;
    wrap.innerHTML = '';
    var q = state.query.trim().toLowerCase();
    var match = function(t) {
      return !q || t.name.toLowerCase().indexOf(q) >= 0 || t.desc.toLowerCase().indexOf(q) >= 0 || cats[t.cat].label.toLowerCase().indexOf(q) >= 0;
    };
    var any = false;

    // Favoriten immer zuerst — in der Reihenfolge der Werkzeugliste
    var favs = TOOLS.filter(function(t){ return isFav(t.id) && match(t); });
    if (favs.length) {
      any = true;
      wrap.appendChild(toolGroup('fav', 'Favoriten', 'var(--c-fav)', 'fav', favs, !!q, true, null));
    } else if (!q) {
      // Ohne Favoriten einmalig erklären, wie man welche anlegt
      wrap.appendChild(toolGroup('fav', 'Favoriten', 'var(--c-fav)', 'fav', [], false, true,
        'Noch keine Favoriten. Tippe auf den Stern einer Karte — die Werkzeuge erscheinen dann hier ganz oben.'));
    }

    CAT_ORDER.forEach(function(c){
      var tools = TOOLS.filter(function(t){ return t.cat===c && match(t); });
      if (!tools.length) return;
      any = true;
      // Bei aktiver Suche immer aufgeklappt zeigen
      wrap.appendChild(toolGroup(c, cats[c].label, cats[c].col, cats[c].icon, tools, !!q, false, null));
    });

    if (!any) wrap.appendChild(el('div', { class:'no-results', text:'Kein Rechner gefunden.' }));
  }
