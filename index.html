  // ---------- Rohrvolumen: dynamische Abschnitte ----------
  function rohrSections() {
    normalizeCombinedState(state.vals,'rohrvol');
    var root=state.vals.rohrvol;
    if (!isPlainObject(root.profiles.volumen)) root.profiles.volumen={};
    var v = root.profiles.volumen;
    if (!v || !Array.isArray(v.sections)) {
      var seed;
      if (v && (v.di != null || v.len != null)) {           // Migration alter Einzelwerte
        seed = [{ di: v.di != null ? v.di : 20, len: v.len != null ? v.len : 10 }];
      } else {
        seed = COMBINED_DEFAULTS.rohrvol.profiles.volumen.sections.map(function(s){ return { dim:s.dim, di:s.di, len:s.len }; });
      }
      root.profiles.volumen = { sections: seed };
    }
    return root.profiles.volumen.sections;
  }
  function setRohrSection(idx, key, val) {
    var secs = rohrSections();
    if (secs[idx]) { secs[idx][key] = val; persist(); renderResult('rohrvol'); }
  }
  function rebuildRohr() {
    var wrap = document.getElementById('tool-fields');
    if (wrap) buildFields('rohrvol', wrap);
    renderResult('rohrvol');
  }
  function addRohrSection() { rohrSections().push({ di:16, len:5 }); persist(); rebuildRohr(); }
  function removeRohrSection(idx) {
    var secs = rohrSections();
    if (secs.length > 1) { secs.splice(idx, 1); persist(); rebuildRohr(); }
  }
  function buildRohrvolFields(wrap) {
    var secs = rohrSections();
    secs.forEach(function(s, idx){
      var head = el('div', { class:'rohr-section-head' }, [
        el('span', { class:'rohr-section-title', text:'Abschnitt ' + (idx+1) }),
        secs.length > 1 ? el('button', { class:'rohr-remove', text:'Entfernen', onClick:function(){ removeRohrSection(idx); } }) : null
      ]);
      // Dropdown: gängige Dimensionen (trägt den Innendurchmesser automatisch ein)
      var sel = el('select', { 'aria-label':'Rohrdimension Abschnitt '+(idx+1) });
      sel.appendChild(el('option', { value:'manual', text:'Manuell — Innen-Ø selbst eingeben' }));
      ROHR_DIMS.forEach(function(g, gi){
        var og = el('optgroup', { label:g.group });
        g.items.forEach(function(it, ii){
          og.appendChild(el('option', { value:gi+'-'+ii, text:it[0]+' — innen '+String(it[1]).replace('.',',')+' mm' }));
        });
        sel.appendChild(og);
      });
      sel.value = s.dim || 'manual';
      sel.addEventListener('change', function(e){
        var v = e.target.value, sc = rohrSections();
        if (v === 'manual') { sc[idx].dim = 'manual'; persist(); renderResult('rohrvol'); return; }
        var p = v.split('-'), it = ROHR_DIMS[+p[0]].items[+p[1]];
        sc[idx].dim = v; sc[idx].di = it[1];
        persist(); rebuildRohr();          // di-Feld mit neuem Wert neu aufbauen
      });
      var di = el('input', { type:'number', step:'any', min:'0.000001', inputmode:'decimal', value: s.di != null ? String(s.di) : '', 'data-field-key':'di-'+idx, 'aria-label':'Innendurchmesser Abschnitt '+(idx+1)+' in mm' });
      di.addEventListener('input', function(e){
        // Handeingabe schaltet auf „Manuell" um
        var sc = rohrSections(); sc[idx].dim = 'manual'; sel.value = 'manual';
        setRohrSection(idx, 'di', e.target.value);
      });
      var len = el('input', { type:'number', step:'any', min:'0.000001', inputmode:'decimal', value: s.len != null ? String(s.len) : '', 'data-field-key':'len-'+idx, 'aria-label':'Länge Abschnitt '+(idx+1)+' in m' });
      len.addEventListener('input', function(e){ setRohrSection(idx, 'len', e.target.value); });
      var dimField = el('div', { class:'field', style:'margin-bottom:12px;' }, [
        el('div', { class:'field-head' }, [ el('span', { class:'field-label', text:'Rohrtyp / Dimension' }) ]), sel
      ]);
      var row = el('div', { class:'rohr-row' }, [
        el('div', { class:'field' }, [ el('div', { class:'field-head' }, [ el('span', { class:'field-label', text:'Innendurchmesser' }), el('span', { class:'field-unit', text:'mm' }) ]), di ]),
        el('div', { class:'field' }, [ el('div', { class:'field-head' }, [ el('span', { class:'field-label', text:'Länge' }), el('span', { class:'field-unit', text:'m' }) ]), len ])
      ]);
      wrap.appendChild(el('div', { class:'rohr-section' }, [head, dimField, row]));
    });
    wrap.appendChild(el('button', { class:'rohr-add', text:'+ Abschnitt hinzufügen', onClick:addRohrSection }));
  }

  // ---------- Heizlast: gemeinsame Felder + dynamische Räume ----------
  function ensureHeizlast() {
    var v = state.vals.heizlast;
    if (!v || !Array.isArray(v.rooms)) {
      state.vals.heizlast = {
        standard: (v && v.standard) || DEFAULTS.heizlast.standard,
        hoehe: (v && v.hoehe != null) ? v.hoehe : DEFAULTS.heizlast.hoehe,
        rooms: DEFAULTS.heizlast.rooms.map(function(r){ return { name:r.name, flaeche:r.flaeche }; })
      };
    }
    return state.vals.heizlast;
  }
  function setHeizlastShared(key, val) { var h = ensureHeizlast(); h[key] = val; persist(); renderResult('heizlast'); }
  function setHeizlastRoom(idx, key, val) { var h = ensureHeizlast(); if (h.rooms[idx]) { h.rooms[idx][key] = val; persist(); renderResult('heizlast'); } }
  function rebuildHeizlast() { var w = document.getElementById('tool-fields'); if (w) buildFields('heizlast', w); renderResult('heizlast'); }
  function addHeizlastRoom() { ensureHeizlast().rooms.push({ name:'', flaeche:10 }); persist(); rebuildHeizlast(); }
  function removeHeizlastRoom(idx) { var h = ensureHeizlast(); if (h.rooms.length > 1) { h.rooms.splice(idx, 1); persist(); rebuildHeizlast(); } }
  function buildHeizlastFields(wrap) {
    var h = ensureHeizlast();

    wrap.appendChild(el('div', { class:'field' }, [ el('div', { class:'field-head' }, [ el('span', { class:'field-label', text:'Baujahr / Standard' }) ]), sel ]));
    // Gemeinsam: Raumhöhe
    var hin = el('input', { type:'number', step:'any', min:'0.000001', inputmode:'decimal', value: h.hoehe != null ? String(h.hoehe) : '', 'data-field-key':'hoehe', 'aria-label':'Raumhöhe in m' });
    hin.addEventListener('input', function(e){ setHeizlastShared('hoehe', e.target.value); });
    wrap.appendChild(el('div', { class:'field' }, [ el('div', { class:'field-head' }, [ el('span', { class:'field-label', text:'Raumhöhe' }), el('span', { class:'field-unit', text:'m' }) ]), hin ]));
    // Räume
    h.rooms.forEach(function(r, idx){
      var head = el('div', { class:'rohr-section-head' }, [
        el('span', { class:'rohr-section-title', text:'Raum ' + (idx+1) }),
        h.rooms.length > 1 ? el('button', { class:'rohr-remove', text:'Entfernen', onClick:function(){ removeHeizlastRoom(idx); } }) : null
      ]);
      var name = el('input', { type:'text', value: r.name != null ? String(r.name) : '', placeholder:'Bezeichnung', 'aria-label':'Bezeichnung Raum '+(idx+1) });
      name.addEventListener('input', function(e){ setHeizlastRoom(idx, 'name', e.target.value); });
      var fl = el('input', { type:'number', step:'any', min:'0.000001', inputmode:'decimal', value: r.flaeche != null ? String(r.flaeche) : '', 'data-field-key':'flaeche-'+idx, 'aria-label':'Fläche Raum '+(idx+1)+' in m²' });
      fl.addEventListener('input', function(e){ setHeizlastRoom(idx, 'flaeche', e.target.value); });
      var row = el('div', { class:'hz-row' }, [
        el('div', { class:'field' }, [ el('div', { class:'field-head' }, [ el('span', { class:'field-label', text:'Raum' }) ]), name ]),
        el('div', { class:'field' }, [ el('div', { class:'field-head' }, [ el('span', { class:'field-label', text:'Fläche' }), el('span', { class:'field-unit', text:'m²' }) ]), fl ])
      ]);
      wrap.appendChild(el('div', { class:'rohr-section' }, [head, row]));
    });
    wrap.appendChild(el('button', { class:'rohr-add', text:'+ Raum hinzufügen', onClick:addHeizlastRoom }));
  }

  function buildFields(id, wrap) {
    wrap.innerHTML = '';
    if (id === 'rohrvol') {
      var rv=effVals(id);
      if (rv.modus==='volumen') {
        var rm=el('select',{id:'field-rohrvol-modus','data-field-key':'modus','aria-label':'Berechnung'});
        [['volumen','Rohrvolumen'],['ausstoss','Warmwasser-Wartezeit'],['dimension','Innendurchmesser (Vorabschätzung)']].forEach(function(o){
          var op=el('option',{value:o[0],text:o[1]}); if (o[0]===rv.modus) op.selected=true; rm.appendChild(op);
        });
        rm.addEventListener('change',function(e){setField(id,'modus',e.target.value);buildFields(id,wrap);});
        wrap.appendChild(el('div',{class:'field'},[el('div',{class:'field-head'},[el('label',{class:'field-label',text:'Berechnung',for:'field-rohrvol-modus'})]),rm]));
        buildRohrvolFields(wrap); return;
      }
    }
    if (id === 'heizlast') { buildHeizlastFields(wrap); return; }
    var ev = effVals(id);
    // Einheiten-Spezialfall: Einheit auf gültigen Wert zwingen
    if (id === 'einheiten') {
      var list = ev.kategorie==='temperatur' ? ['°C','°F','K'] : (UNITS[ev.kategorie]?UNITS[ev.kategorie].units.map(function(u){return u[0];}):[]);
      if (list.indexOf(ev.einheit) < 0) ev.einheit = list[0];
    }
    var defs = fieldDefs(id, ev);
    defs.forEach(function(f){
      var inputId = 'field-' + id + '-' + f.key;
      var head = el('div', { class:'field-head' }, [
        el('label', { class:'field-label', text:f.label, for:inputId }),
        f.unit ? el('span', { class:'field-unit', text:f.unit }) : null
      ]);
      var control;
      var curVal = ev[f.key] != null ? String(ev[f.key]) : '';
      if (f.type === 'select') {
        control = el('select', { id:inputId, 'data-field-key':f.key, 'aria-label':f.label });
        (f.options || []).forEach(function(o){
          var val = Array.isArray(o) ? String(o[0]) : String(o);
          var lab = Array.isArray(o) ? o[1] : String(o);
          var opt = el('option', { value:val, text:lab });
          if (val === curVal) opt.selected = true;
          control.appendChild(opt);
        });
        control.addEventListener('change', function(e){
          setField(id, f.key, e.target.value);
          if (COMBINED_DEFAULTS[id] && f.key==='modus') { buildFields(id,wrap); return; }
          if (id==='fdnummer' && (f.key==='hersteller'||f.key==='format'||f.key==='modus')) { buildFields(id,wrap); return; }
          var active=effVals(id);
          // MAG-Anwendungsart wechselt Formel, Felder und Standardwerte
          if (id === 'mag' && f.key === 'art') buildFields(id, wrap);
          // Kategorie-Wechsel verändert die Einheit-Optionen → Felder neu bauen
          if (id === 'einheiten' && f.key === 'kategorie') buildFields(id, wrap);
          // Bauart-Wechsel verändert die Eingabefelder → neu bauen
          if ((id === 'hkleistung' || (id==='heizkoerper' && active.modus==='bauform')) && f.key === 'bauart') buildFields(id, wrap);
          // Heizkörpertyp setzt einen Richtwert für den Exponenten n → Felder neu bauen
          if (id === 'heizkoerper' && active.modus!=='bauform' && f.key === 'typ' && HKTYP[e.target.value]) {
            setField(id, 'n', HKTYP[e.target.value].n);
            buildFields(id, wrap);
          }
          // Vergleichsheizung setzt Richtwerte für Preis und Wirkungsgrad (bleiben bearbeitbar)
          if ((id === 'jaz' || (id==='cop' && active.modus==='jaz')) && f.key === 'vergleich' && VERGLEICH[e.target.value]) {
            setField(id, 'brennstoff', VERGLEICH[e.target.value].preis);
            setField(id, 'eta', VERGLEICH[e.target.value].eta);
            buildFields(id, wrap);
          }
          // Heizflächentyp setzt einen Richtwert für den Exponenten n (Heizkurve)
          if ((id === 'heizkurve' || (id==='cop' && active.modus==='heizkurve')) && f.key === 'typ' && HKTYP[e.target.value]) {
            setField(id, 'n', HKTYP[e.target.value].n);
            buildFields(id, wrap);
          }
          // Gebäudetyp wechselt die Eingabefelder (WW-Speicher)
          if ((id === 'wwspeicher' || (id==='aufheiz' && active.modus==='speicher')) && f.key === 'gebaeude') buildFields(id, wrap);
          // Installation und Prüfart wechseln die Eingabefelder (Wasser/Gas).
          if (id === 'druckpruef' && (f.key==='anlage'||f.key==='verfahren'||f.key==='gasdruckbereich'||f.key==='gaspruefung')) buildFields(id, wrap);
          // Lüftungsverfahren trennt DIN-18017-Auswahl und freien Überschlag.
          if (id === 'lueftung' && f.key === 'modus') buildFields(id,wrap);
          // Brennerstufen wechseln die Eingabefelder (Öldüsen: Aufteilung nur bei 2-stufig)
          if ((id === 'oelduese' || (id==='gas' && active.modus==='oelduese')) && f.key === 'stufen') buildFields(id, wrap);
          // Nutz-/Feuerungsleistung verändert das Wirkungsgradfeld.
          if (id==='gas' && active.modus==='gas' && f.key==='leistungsart') buildFields(id,wrap);
        });
      } else if (f.type === 'text') {
        var textAttrs={id:inputId,type:'text',value:curVal,'data-field-key':f.key,'aria-label':f.label};
        if (f.placeholder) textAttrs.placeholder=f.placeholder;
        if (f.maxlength) textAttrs.maxlength=String(f.maxlength);
        if (f.inputmode) textAttrs.inputmode=f.inputmode;
        control=el('input',textAttrs);
        control.addEventListener('input',function(e){setField(id,f.key,e.target.value);});
      } else {
        var rule = fieldRule(id,f.key,ev);
        var inputAttrs = { id:inputId, type:'number', step:'any', inputmode:'decimal', value:curVal, 'data-field-key':f.key, 'aria-label':f.label + (f.unit ? ' in ' + f.unit : '') };
        if (rule.min != null) inputAttrs.min = String(rule.min);
        if (rule.max != null) inputAttrs.max = String(rule.max);
        control = el('input', inputAttrs);
        control.addEventListener('input', function(e){ setField(id, f.key, e.target.value); });
      }
      wrap.appendChild(el('div', { class:'field' }, [head, control]));
    });
  }

  function applyValidationErrors(errors) {
    var fields=document.getElementById('tool-fields');
    if (!fields) return;
    fields.querySelectorAll('.field.invalid').forEach(function(x){ x.classList.remove('invalid'); });
    fields.querySelectorAll('.field-error').forEach(function(x){ x.remove(); });
    var seen={};
    (errors||[]).forEach(function(er){
      if (seen[er.key]) return; seen[er.key]=true;
      var control=fields.querySelector('[data-field-key="'+er.key+'"]');
      if (!control) return;
      var box=control.closest('.field');
      if (!box) return;
      box.classList.add('invalid'); control.setAttribute('aria-invalid','true');
      var msg=el('div',{class:'field-error',text:er.message,id:'error-'+er.key});
      control.setAttribute('aria-describedby',msg.id); box.appendChild(msg);
    });
    fields.querySelectorAll('[data-field-key]').forEach(function(c){
      if (!seen[c.getAttribute('data-field-key')]) { c.removeAttribute('aria-invalid'); c.removeAttribute('aria-describedby'); }
    });
  }
  function methodMetaElement(id) {
    var m=methodFor(id);
    return el('div',{class:'method-meta'},[
      el('strong',{text:m.kind+' · Prüfstand 08/2026'}),
      el('div',{text:'Grundlage: '+m.basis+'. Hersteller-, Objekt- und örtliche Vorgaben haben Vorrang.'})
    ]);
  }

  function renderResult(id) {
    var wrap = document.getElementById('tool-result');
    if (!wrap) return;
    var ev = effVals(id);
    if (id === 'einheiten') {
      var list = ev.kategorie==='temperatur' ? ['°C','°F','K'] : (UNITS[ev.kategorie]?UNITS[ev.kategorie].units.map(function(u){return u[0];}):[]);
      if (list.indexOf(ev.einheit) < 0) ev.einheit = list[0];
    }
    wrap.innerHTML = '';
    var validation=validateFor(id,ev);
    applyValidationErrors(validation.errors);
    if (!validation.ok) {
      var ul=el('ul');
      validation.errors.forEach(function(er){ ul.appendChild(el('li',{text:er.message})); });
      wrap.appendChild(el('div',{class:'validation-summary',role:'alert'},[el('strong',{text:'Eingaben prüfen'}),ul]));
      wrap.appendChild(methodMetaElement(id));
      return;
    }
    var res = computeFor(id, ev);

    if (res.main) {
      wrap.appendChild(el('div', { class:'result-main' }, [
        el('div', { class:'result-main-label', text:res.main.label }),
        el('div', { class:'result-main-row' }, [
          el('span', { class:'result-main-value', text:res.main.value }),
          el('span', { class:'result-main-unit', text:res.main.unit })
        ])
      ]));
    }
    if (res.subs && res.subs.length) {
      var subs = el('div', { class:'result-subs' });
      res.subs.forEach(function(r){
        subs.appendChild(el('div', { class:'result-sub' }, [
          el('span', { class:'result-sub-label', text:r.label }),
          el('span', { class:'result-sub-value', text:r.value })
        ]));
      });
      wrap.appendChild(subs);
    }
    if (res.note) wrap.appendChild(el('div', { class:'result-note', text:res.note }));

    if (res.refs && res.refs.length) {
      wrap.appendChild(el('div', { class:'result-ref-title', text: res.refTitle || 'Richtwerte' }));
      var refs = el('div', { class:'result-subs' });
      res.refs.forEach(function(r){
        refs.appendChild(el('div', { class:'result-sub' }, [
          el('span', { class:'result-sub-label', text:r.label }),
          el('span', { class:'result-sub-value', text:r.value })
        ]));
      });
      wrap.appendChild(refs);
    }
    wrap.appendChild(methodMetaElement(id));
  }

  // ---------- Haupt-Render ----------
  function render() {
    var app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(renderHeader());

    if (state.view === 'home') {
      app.appendChild(renderHome());
      renderHomeGroups();
    } else {
      var tl = TOOLS.find(function(t){ return t.id === state.view; });
      // Kategoriefarbe an die ganze Werkzeug-Ansicht durchreichen (Ergebniskachel, Akzente)
      var toolWrap = el('div', { class:'tool-wrap anim-rise', style: tl ? '--cat:'+cats[tl.cat].col+';' : '' });
      toolWrap.appendChild(renderTool(state.view));
      app.appendChild(toolWrap);
      renderResult(state.view);
    }
    updateHeaderShadow();
  }

  // Trennlinie unter dem Header erst zeigen, wenn gescrollt wurde
  function updateHeaderShadow() {
    var h = document.querySelector('.header');
    if (h) h.classList.toggle('scrolled', window.scrollY > 6);
  }

  // ---------- Init ----------
  loadState();
  applyTheme();
  applyRoute(true);
  window.addEventListener('scroll', updateHeaderShadow, { passive:true });
  window.addEventListener('popstate', function(){ applyRoute(false); });
  window.addEventListener('hashchange', function(){ applyRoute(false); });

  // Systemeinstellung Hell/Dunkel live verfolgen, solange nichts explizit gewählt wurde
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSchemeChange = function (e) {
      if (!themeChosen) { state.theme = e.matches ? 'dark' : 'light'; applyTheme(); render(); }
    };
    if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
    else if (mq.addListener) mq.addListener(onSchemeChange);
  }
  window.SHK_NOTIFY = showToast;
  window.SHK_TEST = {
    computeFor:computeFor,
    validateFor:validateFor,
    buildPdf:buildPdf,
    sanitizeImportedVals:sanitizeImportedVals,
    magDefaults:copyOwn(MAG_DEFAULTS),
    auditDefaults:function(){
      var saved=state.vals, report=[];
      try {
        state.vals={}; normalizeMagState(state.vals);
        TOOLS.forEach(function(t){
          try {
            var ev=effVals(t.id), check=validateFor(t.id,ev), res=check.ok?computeFor(t.id,ev):null;
            report.push({id:t.id,ok:check.ok&&!!res,errors:check.errors});
          } catch(e) { report.push({id:t.id,ok:false,errors:[{message:e.message}]}); }
        });
      } finally { state.vals=saved; }
      return report;
    }
  };
})();
</script>
<script>
// Service Worker registrieren — macht die App nach dem ersten Besuch komplett offline nutzbar
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        var worker=reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', function(){
          if (worker.state==='installed' && navigator.serviceWorker.controller && window.SHK_NOTIFY) window.SHK_NOTIFY('Update installiert — beim nächsten Start aktiv.');
        });
      });
    }).catch(function(){ if (window.SHK_NOTIFY) window.SHK_NOTIFY('Offline-Modus konnte nicht aktiviert werden.'); });
  });
}
</script>
