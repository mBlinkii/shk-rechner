<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHK Rechner – Regressionstests</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;max-width:820px;margin:32px auto;padding:0 20px;background:#f6f5f2;color:#17161c}h1{font-size:26px}.summary{font-weight:700;padding:12px 15px;border-radius:10px;background:#fff;border:1px solid #ddd}.pass{color:#167447}.fail{color:#b3263e}li{margin:7px 0}iframe{position:fixed;left:-200vw;top:0;width:360px;height:800px;border:0}
</style>
</head>
<body>
<h1>SHK Rechner – Regressionstests</h1>
<p class="summary" id="summary">Tests laufen …</p>
<ol id="results"></ol>
<textarea id="pdf-data" hidden aria-hidden="true"></textarea>
<iframe id="app" src="../index.html#/home" title="Testinstanz"></iframe>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('app'), list=document.getElementById('results'), summary=document.getElementById('summary');
  frame.addEventListener('load',function(){
    var api=frame.contentWindow.SHK_TEST, passed=0, failed=0;
    function test(name,fn){
      var li=document.createElement('li');
      try{ if(!fn()) throw new Error('Erwartung nicht erfüllt'); li.textContent='✓ '+name; li.className='pass'; passed++; }
      catch(e){ li.textContent='✗ '+name+': '+e.message; li.className='fail'; failed++; }
      list.appendChild(li);
    }
    test('Test-API ist verfügbar',function(){return !!api;});
    test('12 kW / 20 K ergeben 516 l/h',function(){return api.computeFor('leistung',{modus:'volumenstrom',leistung:12,dt:20}).main.value==='516';});
    test('Sammelrechner berechnet Leistung aus Volumenstrom',function(){return api.computeFor('leistung',{modus:'leistung',vstrom:516,veinheit:'l/h',dt:20}).main.value==='12,00';});
    test('Negative Heizleistung wird abgewiesen',function(){return !api.validateFor('leistung',{modus:'volumenstrom',leistung:-12,dt:20}).ok;});
    test('Heizungs-MAG ergibt Standardgröße 18 l',function(){return api.computeFor('mag',{art:'heizung',vol:200,tmax:70,hstat:5,pmin:0.8,psv:3}).main.value==='18';});
    test('Solar-MAG berücksichtigt 4 % Vorlage, β und Dampfrohr',function(){return api.computeFor('mag',{art:'solar',vol:50,flaeche:6,kolltyp:'flach',rohrdampf:0,beta:13,hstat:8,pmin:4,psv:6}).main.value==='80';});
    test('Trinkwasser-MAG ergibt Standardgröße 25 l',function(){return api.computeFor('mag',{art:'trinkwasser',vol:300,tk:10,tw:60,pmin:4,peingang:4,psv:6}).main.value==='25';});
    test('MAG lehnt zu kleinen Ansprechdruck ab',function(){return !api.validateFor('mag',{art:'heizung',vol:200,tmax:70,hstat:5,pmin:4,psv:3}).ok;});
    test('Sicherheitsventil interpoliert nicht: 51 kW erfordern DN 20',function(){return api.computeFor('sv',{leistung:51,psv:3,hstat:10}).main.value==='DN 20';});
    test('VDI 2035: über 40 l/kW gilt 0,3 °dH',function(){var r=api.computeFor('fuellwasser',{gesamtleistung:20,leistung:20,vol:900,erzeugerinhalt:'gross',haerte:1});return r.main.value==='Ja'&&r.subs[0].value.indexOf('0,3 °dH')===0;});
    test('Schallplanung 55/35 dB an Wand ergibt rund 11,2 m',function(){return api.computeFor('schall',{lw:55,immission:35,ton:0,aufstellung:3}).main.value==='11,2';});
    test('DIN-18017-Modus liefert für Bad R-PN 60 m³/h',function(){return api.computeFor('lueftung',{modus:'din18017',raum18017:'bad',steuerung:'rpn'}).main.value==='60';});
    test('Wasserprüfung rechnet 1,1 × 8 bar = 8,8 bar',function(){return api.computeFor('druckpruef',{verfahren:'wasser',werkstoff:'metall',betriebsdruck:8}).main.value==='8,8';});
    test('Gas-Belastungsprüfung verwendet 1 bar und 10 min',function(){var r=api.computeFor('druckpruef',{anlage:'gas',gasdruckbereich:'niederdruck',gaspruefung:'belastung',druckabfall:'nein'});return r.main.value==='Bestanden'&&r.subs.some(function(x){return x.label==='Prüfdruck'&&x.value==='0,1 MPa (1 bar)';});});
    test('Gas-Dichtheitsprüfung ab 100 l verwendet 30/20 min',function(){var r=api.computeFor('druckpruef',{anlage:'gas',gasdruckbereich:'niederdruck',gaspruefung:'dichtheit',gasvol:100,druckabfall:'nein'});return r.subs.some(function(x){return x.value==='mindestens 30 min';})&&r.subs.some(function(x){return x.value==='mindestens 20 min';});});
    test('Gas-Gebrauchsfähigkeit stuft 1 l/h vermindert ein',function(){return api.computeFor('druckpruef',{anlage:'gas',gasdruckbereich:'niederdruck',gaspruefung:'gebrauch',leckrate:1,maengel:'keine'}).main.value==='Verminderte Gebrauchsfähigkeit';});
    test('Gas-Gebrauchsfähigkeit stuft 5 l/h nicht gebrauchsfähig ein',function(){return api.computeFor('druckpruef',{anlage:'gas',gasdruckbereich:'niederdruck',gaspruefung:'gebrauch',leckrate:5,maengel:'keine'}).main.value==='Keine Gebrauchsfähigkeit';});
    test('Gas-Gebrauchsfähigkeit zeigt Betriebsdruck als Messdruck',function(){var r=api.computeFor('druckpruef',{anlage:'gas',gasdruckbereich:'niederdruck',gaspruefung:'gebrauch',gasbetriebsdruck:23,gebrauchsdruck:'betrieb',leckrate:0.5,maengel:'keine'});return r.subs.some(function(x){return x.label==='Mess-/Prüfdruck'&&x.value.indexOf('23,0 hPa')>=0;});});
    test('Gas-Gebrauchsfähigkeit zeigt 50 hPa und Rückrechnungshinweis',function(){var r=api.computeFor('druckpruef',{anlage:'gas',gasdruckbereich:'niederdruck',gaspruefung:'gebrauch',gasbetriebsdruck:23,gebrauchsdruck:'50',leckrate:0.5,maengel:'keine'});return r.subs.some(function(x){return x.label==='Mess-/Prüfdruck'&&x.value==='50 hPa (50 mbar)';})&&r.note.indexOf('zurückgerechnet')>=0;});
    test('Druckabfall lässt die Gasprüfung durchfallen',function(){return api.computeFor('druckpruef',{anlage:'gas',gasdruckbereich:'niederdruck',gaspruefung:'dichtheit',gasvol:80,druckabfall:'ja'}).main.value==='Nicht bestanden';});
    test('R290 löst auch bei großer Menge keine F-Gas-Prüfpflicht aus',function(){return api.computeFor('kaeltemittel',{mittel:'r290',menge:2000000}).subs[0].value.indexOf('keine F-Gas')===0;});
    test('Pflegeheim besitzt eigene Gleichzeitigkeitskoeffizienten',function(){return api.computeFor('spitzenvs',{typ:'pflege',summe:2}).main.value!==api.computeFor('spitzenvs',{typ:'kh',summe:2}).main.value;});
    test('FD 968 ergibt August 1999',function(){return api.computeFor('fdnummer',{modus:'fdzudatum',fd:'968'}).main.value==='August 1999';});
    test('FD 417 ergibt Januar 2014',function(){return api.computeFor('fdnummer',{modus:'fdzudatum',fd:'FD 417'}).main.value==='Januar 2014';});
    test('Juli 2024 ergibt FD 475',function(){return api.computeFor('fdnummer',{modus:'datumzufd',jahr:2024,monat:'7'}).main.value==='475';});
    test('Dezember 2030 ergibt FD 0AC',function(){return api.computeFor('fdnummer',{modus:'datumzufd',jahr:2030,monat:'12'}).main.value==='0AC';});
    test('FD-Tabellengrenzen 1974–2030 stimmen',function(){return [[1974,1,'421'],[1980,1,'041'],[2009,12,'992'],[2013,12,'312'],[2014,5,'453'],[2019,12,'960'],[2020,1,'037'],[2029,12,'980'],[2030,10,'0AA']].every(function(x){return api.computeFor('fdnummer',{modus:'datumzufd',jahr:x[0],monat:String(x[1])}).main.value===x[2];});});
    test('Viessmann: 8. Ziffer und Jahrzehnt ergeben 2004',function(){return api.computeFor('fdnummer',{hersteller:'viessmann',code:'7324722 400 119',jahrzehnt:'2000'}).main.value==='2004';});
    test('Vaillant: neue Serialnummer ergibt KW 01 / 2004',function(){return api.computeFor('fdnummer',{hersteller:'vaillant',format:'neu',code:'21 04 01 006304 0001 005001 N 7'}).main.value==='KW 01 / 2004';});
    test('Wolf-Altformat ergibt KW 11 / 1996',function(){return api.computeFor('fdnummer',{hersteller:'wolf',code:'9116 456547'}).main.value==='KW 11 / 1996';});
    test('Brötje 11050131 ergibt Mai 2011',function(){return api.computeFor('fdnummer',{hersteller:'broetje',format:'seit2010',code:'11050131'}).main.value==='Mai 2011';});
    test('Danfoss BE3921B ergibt KW 39 / 2021',function(){return api.computeFor('fdnummer',{hersteller:'danfoss',format:'ventil',code:'BE3921B'}).main.value==='KW 39 / 2021';});
    test('Honeywell 7812 ergibt KW 12 / 1978',function(){return api.computeFor('fdnummer',{hersteller:'honeywell',format:'yyww',code:'7812'}).main.value==='KW 12 / 1978';});
    test('Grundfos PC 0213 ergibt KW 13 / 2002',function(){return api.computeFor('fdnummer',{hersteller:'grundfos',code:'PC:0213'}).main.value==='KW 13 / 2002';});
    test('Wilo 2020W53 wird korrekt gelesen',function(){return api.computeFor('fdnummer',{hersteller:'wilo',code:'2020W53'}).main.value==='KW 53 / 2020';});
    test('Alle Modi der Sammelrechner liefern Ergebnisse',function(){var c=[
      ['leistung',{modus:'waermetauscher',leistung:30,dt:50}],['heizkoerper',{modus:'bauform',bauart:'platte',ptyp:'22',hoehe:600,laenge:1000,tiefe:100}],
      ['gas',{modus:'gas',leistungsart:'nutz',leistung:20,eta:95,region:'hh'}],['gas',{modus:'oelduese',leistung:20,eta:92,druck:10,stufen:'1',teilung:60}],['gas',{modus:'kondensat',brennstoff:'erdgasH',leistung:20,ruecklauf:30}],
      ['aufheiz',{modus:'mischwasser',vsp:300,tsp:60,tkalt:10,tmisch:38}],['aufheiz',{modus:'speicher',gebaeude:'efh',personen:4,wohnungen:6,komfort:'mittel'}],
      ['rohrvol',{modus:'ausstoss',di:13,laenge:10,durchfluss:5}],['rohrvol',{modus:'dimension',vstrom:600,v:0.8}],
      ['cop',{modus:'cop',wptyp:'luftwasser',src:2,sink:35}],['cop',{modus:'jaz',bedarf:15000,jz:3.5,strom:28,vergleich:'gas',brennstoff:12,eta:95}],['cop',{modus:'bivalenz',hl:10,tnorm:-12,hgrenze:15,pwp:8}],['cop',{modus:'puffer',pwp:8,typ:'parallel'}],['cop',{modus:'heizkurve',vlnorm:35,tnorm:-12,traum:20,taussen:0,typ:'fbh',n:1.1}]
    ];return c.every(function(x){var v=api.validateFor(x[0],x[1]),r=v.ok?api.computeFor(x[0],x[1]):null;return v.ok&&r&&r.main&&r.main.value&&r.main.value!=='–';});});
    test('Import begrenzt Rohrabschnitte auf 100',function(){var x={rohrvol:{sections:Array.from({length:130},function(){return{di:16,len:5};})}};return api.sanitizeImportedVals(x).rohrvol.profiles.volumen.sections.length===100;});
    test('Alter Leistung-Link wird als Sammelrechner-Profil migriert',function(){var x=api.sanitizeImportedVals({leistungaus:{vstrom:600,veinheit:'l/h',dt:10}});return x.leistung.modus==='leistung'&&x.leistung.profiles.leistung.vstrom===600;});
    test('Alle 26 sichtbaren Rechner bestehen mit Standardwerten',function(){var report=api.auditDefaults(),bad=report.filter(function(x){return !x.ok;});if(report.length!==26)throw new Error('Anzahl '+report.length);if(bad.length)throw new Error(bad.map(function(x){return x.id;}).join(', '));return true;});
    test('PDF-Generator erzeugt bei langen Berichten mehrere Seiten',function(){var rows=[];for(var i=0;i<90;i++)rows.push({label:'Prüfzeile '+i,value:'Wert '+i});var p=api.buildPdf({title:'Test',subtitle:'Regression',rows:rows,note:'Ende'});var m=p.match(/\/Count (\d+)/);return m&&Number(m[1])>1;});
    var pdfRows=[{head:'Eingaben'}];
    for(var p=1;p<=90;p++)pdfRows.push({label:'Prüfzeile mit längerer Beschriftung '+p,value:'Langer Beispielwert für den Umbruch '+p});
    document.getElementById('pdf-data').textContent=btoa(api.buildPdf({title:'SHK PDF Mehrseitentest',subtitle:'Layoutprüfung 22.08.2026',rows:pdfRows,note:'Dieser Prüfbericht kontrolliert Seitenumbrüche, lange Zeilen, Fußzeilen und Seitenzahlen.'}));
    summary.textContent=passed+' bestanden, '+failed+' fehlgeschlagen';
    summary.className='summary '+(failed?'fail':'pass');
    document.title=(failed?'FEHLER: ':'OK: ')+'SHK Regressionstests';
  });
})();
</script>
</body>
</html>
